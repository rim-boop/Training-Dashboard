<!doctype html>
<html lang="en">
<title>Team Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E6E55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: app shell. Sidebar (Training / Onboarding) + top bar + one view at a time. Brand colour comes from /api/brand. */
  :root {
    --brand: #0E6E55;
    --bg: #F7F6F2;
    --surface: #ffffff;
    --surface-2: #F3F2EC;
    --fg: #1C2420;
    --muted: #5A635E;
    --line: #E6E3DA;
    --accent: var(--brand);
    --accent-ink: #ffffff;
    --accent-soft: color-mix(in srgb, var(--brand) 12%, white);
    --ok: #05603A;     --ok-soft: #DCF5E7;
    --soon: #93370D;   --soon-soft: #FEF0C7;
    --late: #B42318;   --late-soft: #FEE4E2;
    --miss: #475467;   --miss-soft: #EEF0F2;
    --retake: #6B21A8; --retake-soft: #F3E8FF;
    --update: #9D174D; --update-soft: #FCE7F3;
    --sign: #1E40AF;   --sign-soft: #DBEAFE;
    --na: #D6D3CA;
    --body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121614; --surface: #1A201D; --surface-2: #222a26; --fg: #E7ECE9; --muted: #A1ACA6; --line: #2E3833;
      --accent: color-mix(in srgb, var(--brand) 55%, white); --accent-ink: #0F1A15; --accent-soft: color-mix(in srgb, var(--brand) 30%, #1A201D);
      --ok: #6CC595; --ok-soft: #1C3227; --soon: #E0B062; --soon-soft: #362B17; --late: #EC8A82; --late-soft: #3A1F1D;
      --miss: #B4BCC6; --miss-soft: #2A3034; --retake: #C9A6EE; --retake-soft: #2E2340; --update: #EE9CC6; --update-soft: #3A1F2E; --sign: #9DB8F2; --sign-soft: #1D2A44; --na: #3A4540;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121614; --surface: #1A201D; --surface-2: #222a26; --fg: #E7ECE9; --muted: #A1ACA6; --line: #2E3833;
    --accent: color-mix(in srgb, var(--brand) 55%, white); --accent-ink: #0F1A15; --accent-soft: color-mix(in srgb, var(--brand) 30%, #1A201D);
    --ok: #6CC595; --ok-soft: #1C3227; --soon: #E0B062; --soon-soft: #362B17; --late: #EC8A82; --late-soft: #3A1F1D;
    --miss: #B4BCC6; --miss-soft: #2A3034; --retake: #C9A6EE; --retake-soft: #2E2340; --update: #EE9CC6; --update-soft: #3A1F2E; --sign: #9DB8F2; --sign-soft: #1D2A44; --na: #3A4540;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.5 var(--body); }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* App shell */
  .app { display: flex; min-height: 100vh; }
  .side { width: 248px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; min-width: 0; }
  .brand .mark { width: 36px; height: 36px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; overflow: hidden; }
  .brand .mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand .bn { font-weight: 700; font-size: 15px; line-height: 1.2; overflow-wrap: anywhere; }
  .brand .bs { font-size: 12px; color: var(--muted); }
  .sec { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 18px 12px 6px; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--fg); opacity: .85; font-weight: 500; font-size: 14px; cursor: pointer; text-align: left; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav:hover { background: var(--surface-2); opacity: 1; }
  .nav[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; opacity: 1; }
  .nav .cnt { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 1px 8px; }
  #grp-onboarding:not([hidden]) { display: contents; }
  .side .foot { margin-top: auto; padding: 16px 12px 0; font-size: 12px; color: var(--muted); }
  .mainc { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .fresh { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .fresh .dot { width: 8px; height: 8px; border-radius: 50%; background: #12B76A; flex: none; }
  .fresh .dot.warn { background: #F79009; }
  .fresh .dot.err { background: var(--late); }
  .who { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .who .wn { display: grid; line-height: 1.3; }
  .who .wn b { font-weight: 600; }
  .who .wn span { color: var(--muted); font-size: 12px; }
  .content { padding: 28px 32px 56px; max-width: 1200px; width: 100%; display: grid; gap: 20px; }
  .ph h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .ph p { margin: 4px 0 0; color: var(--muted); }
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .side { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { width: 100%; padding: 2px 4px 8px; }
    .sec, .side .foot { display: none; }
    .nav { width: auto; padding: 8px 10px; }
    .top, .content { padding-left: 16px; padding-right: 16px; }
  }
  #view { display: grid; gap: 20px; min-width: 0; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
  .link { font-size: 13px; color: var(--muted); }

  /* Cards and stats */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 6px; align-content: start; }
  .stat .k { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stat .v { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .stat .s { font-size: 12.5px; color: var(--muted); }
  .v.late { color: var(--late); } .v.soon { color: var(--soon); } .v.ok { color: var(--ok); }
  .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; min-width: 0; align-content: start; }
  .panel h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .panel .sub { color: var(--muted); margin: -8px 0 0; font-size: 13px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }

  /* Status chips */
  .chip, .badge, .pill, .tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); justify-self: start; }
  .k-ok { background: var(--ok-soft); color: var(--ok); } .k-soon { background: var(--soon-soft); color: var(--soon); }
  .k-late { background: var(--late-soft); color: var(--late); } .k-missing { background: var(--miss-soft); color: var(--miss); }
  .k-retake { background: var(--retake-soft); color: var(--retake); } .k-update { background: var(--update-soft); color: var(--update); }
  .k-signoff { background: var(--sign-soft); color: var(--sign); }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .st-ok { background: var(--ok); } .st-soon { background: var(--soon); } .st-late { background: var(--late); }
  .st-missing { background: var(--miss); } .st-retake { background: var(--retake); } .st-update { background: var(--update); } .st-signoff { background: var(--sign); } .st-na { background: var(--na); }

  /* Compliance matrix */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .mx { overflow-x: auto; margin: 0 -20px -20px; }
  .mx table { border-collapse: collapse; width: auto; }
  .mx th, .mx td { border-bottom: 1px solid var(--line); }
  .mx thead th { vertical-align: bottom; padding: 0 6px 12px; background: var(--surface); font-weight: 500; }
  .mx thead th.col { width: 52px; min-width: 52px; }
  .mx thead th.col span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-size: 12px; color: var(--muted); display: inline-block; max-height: 260px; overflow: hidden; text-overflow: ellipsis; }
  .mx td { padding: 10px 6px; text-align: center; }
  .mx td.who { text-align: left; padding-left: 20px; min-width: 220px; position: sticky; left: 0; background: var(--surface); }
  .mx td.pc, .mx th.pc { text-align: right; padding-left: 20px; padding-right: 20px; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mx tfoot td { background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 0; }
  .mx tfoot td.who { background: var(--surface-2); }
  .mx tbody tr:hover td { background: var(--surface-2); }
  .cell { width: 26px; height: 26px; border-radius: 7px; display: inline-block; vertical-align: middle; }
  .cell.st-ok { background: var(--ok); } .cell.st-soon { background: #E8A33D; } .cell.st-late { background: var(--late); }
  .cell.st-missing { background: color-mix(in srgb, var(--miss) 35%, var(--surface)); } .cell.st-retake { background: var(--retake); }
  .cell.st-update { background: var(--update); } .cell.st-signoff { background: var(--surface); box-shadow: inset 0 0 0 3px var(--sign); }
  .cell.st-na { background: transparent; border: 1px dashed var(--na); }
  .legend .cell { width: 14px; height: 14px; border-radius: 4px; }

  /* People table */
  .tbl { overflow-x: auto; margin: 0 -20px -20px; }
  .tbl table { width: 100%; min-width: 640px; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 10px 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tbl td { padding: 12px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr { cursor: pointer; }
  .tbl tbody tr:hover { background: var(--surface-2); }
  .progcell { display: flex; align-items: center; gap: 10px; min-width: 140px; }
  .progcell .bar { flex: 1; }
  .progcell span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 34px; }
  .nextc { display: grid; font-size: 13px; }
  .nextc span { font-size: 12px; color: var(--muted); }
  .rowbtn { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  .nm { font-weight: 600; line-height: 1.25; }
  .role { font-size: 12.5px; color: var(--muted); }

  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; }
  .av.lg { width: 48px; height: 48px; font-size: 16px; }

  /* Waiting for you */
  .todo { display: grid; }
  .todo > div { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
  .todo > div:first-child { border-top: 0; padding-top: 0; }
  .todo .tt { font-size: 14px; }
  .todo .tt b { font-weight: 600; }
  .todo .ta { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .signrow { display: grid; gap: 10px; }
  .signrow .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Lists */
  .group { display: grid; gap: 8px; }
  .group h3 { font-size: 13px; font-weight: 600; margin: 4px 0 0; display: flex; align-items: center; gap: 8px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .item { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit; text-decoration: none; min-width: 0; }
  a.item:hover { border-color: var(--accent); }
  .item .t { font-weight: 600; overflow-wrap: anywhere; }
  .item .d { font-size: 12.5px; color: var(--muted); }
  .chip.extra { background: var(--surface-2); color: var(--muted); }

  .people { display: grid; gap: 6px; }
  .person { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); color: inherit; text-decoration: none; flex-wrap: wrap; }
  a.person:hover { border-color: var(--accent); }
  .person .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .person .d { font-size: 12.5px; color: var(--muted); }

  .pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pick label { font-size: 13px; color: var(--muted); font-weight: 500; }
  select { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }

  .profile { display: flex; gap: 14px; align-items: center; }
  .profile h2 { font-size: 20px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
  .facts b { color: var(--fg); font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--fg); text-decoration: none; }
  .btn:hover { border-color: var(--accent); }
  .btn.small { padding: 5px 12px; }
  .btn.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; justify-self: start; }
  .primary:hover { filter: brightness(1.08); }
  .filters { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); flex-wrap: wrap; }
  .filters button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(16,24,40,.1); }

  /* Calendar */
  .calbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .calnav { display: flex; gap: 8px; align-items: center; }
  .calnav h2 { min-width: 9.5em; text-align: center; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .dow { font-size: 12px; color: var(--muted); text-align: center; font-weight: 500; padding-bottom: 2px; }
  .day { min-height: 92px; border-radius: 8px; background: var(--surface-2); padding: 6px; display: grid; align-content: start; gap: 4px; min-width: 0; }
  .day.out { background: transparent; border: 1px dashed var(--line); }
  .day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day .n { font-size: 12px; font-weight: 500; color: var(--muted); }
  .ev { font-size: 11.5px; line-height: 1.25; padding: 3px 6px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { font-size: 11px; color: var(--muted); }
  @media (max-width: 640px) {
    .day { min-height: 54px; padding: 4px; }
    .ev { font-size: 0; padding: 0; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .ev.k-late { background: var(--late); } .ev.k-soon { background: var(--soon); } .ev.k-ok { background: var(--ok); }
    .day .evs { display: flex; flex-wrap: wrap; gap: 3px; }
    .more { display: none; }
  }
  .agenda { display: grid; gap: 6px; }
  .agenda .row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); color: inherit; text-decoration: none; }
  .agenda .date { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .agenda .what { min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 520px) { .agenda .row { grid-template-columns: minmax(0, 1fr) auto; } .agenda .date { grid-column: 1 / -1; } }

  .empty { color: var(--muted); padding: 8px 0; margin: 0; }
  .notice { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 24px; display: grid; gap: 10px; max-width: 520px; }
  .notice h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .notice p { margin: 0; }
  .notice input { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .notice .err { color: var(--late); font-size: 14px; }
  .skeleton { height: 110px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { #view { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }

  /* Onboarding */
  .hires { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .hire { display: grid; gap: 12px; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; cursor: pointer; }
  .hire:hover { border-color: var(--accent); }
  .hire[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .hire .l { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .hire .l > span:nth-child(2) { flex: 1; min-width: 0; }
  .hire .prog { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .hire .prog b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .phase { display: grid; gap: 6px; }
  .phase h3 { font-size: 12px; font-weight: 600; margin: 8px 0 2px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
  .task input:disabled { cursor: not-allowed; }
  .task .tn { overflow-wrap: anywhere; font-weight: 500; }
  .task.is-done .tn { color: var(--muted); text-decoration: line-through; }
  .task .tm { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .task .tm a { color: var(--accent); }
  .tag { font-size: 11.5px; padding: 2px 8px; }
  .tag.hr { background: var(--soon-soft); color: var(--soon); } .tag.nh { background: var(--accent-soft); color: var(--accent); }
  .tag.late { background: var(--late-soft); color: var(--late); } .tag.soon { background: var(--soon-soft); color: var(--soon); }
  .pill.late { background: var(--late-soft); color: var(--late); } .pill.done { background: var(--ok-soft); color: var(--ok); }
  .task .tn button { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .task .tn button:hover { color: var(--accent); text-decoration: underline; }
  .desc { grid-column: 2 / -1; background: var(--surface-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
  .desc > * { margin: 0; } .desc ul, .desc ol { padding-left: 1.3em; margin: 0; }
  .desc h4, .desc h5 { margin: 0; font-size: 15px; font-weight: 600; }
  .desc .call { background: var(--surface); border-radius: 8px; padding: 10px 12px; }
  .desc img { max-width: 100%; border-radius: 6px; }
</style>

<div class="app">

    <div role="tablist" aria-label="Training" style="display:contents">

      <button class="tab nav" role="tab" id="tab-compliance" data-tab="compliance" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Compliance</button>
      <button class="tab nav" role="tab" id="tab-employees" data-tab="employees" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>People</button>
      <button class="tab nav" role="tab" id="tab-trainings" data-tab="trainings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>Trainings</button>
      <button class="tab nav" role="tab" id="tab-calendar" data-tab="calendar" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    </div>
    <div id="grp-onboarding" hidden>
      <div class="sec">Onboarding</div>
      <button class="tab nav" role="tab" id="tab-onboarding" data-tab="onboarding" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.5 3.4-5.5 6.5-5.5 1.6 0 3 .5 4.2 1.4"/><path d="M18 14v6M15 17h6"/></svg>New hires<span class="cnt" id="hireCount" hidden></span></button>
    </div>
    <div class="foot">Powered by The Founder Boost</div>
  </aside>

  <div class="mainc">
    <header class="top">
      <div class="fresh" id="fresh"><span class="dot warn" id="dot"></span><span id="freshText">Loading from Notion…</span></div>
      <div class="who" id="who" hidden></div>
    </header>
    <div class="content">
      <div class="ph"><h1 id="pageTitle">Training overview</h1><p id="pageSub"></p></div>
      <main id="view" aria-live="polite">
        <div class="stats"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      </main>
    </div>
  </div>
</div>

<script>
// A snapshot is embedded only in the preview build. The deployed app leaves it null and reads /api/dashboard.
const SNAPSHOT = /*SNAPSHOT*/null/*END*/;
const REFRESH_MS = 60000;
const DUE_SOON_DAYS = 60;

const STATUS = {
  missing: { label: "Not completed",     order: 0 },
  retake:  { label: "Retake required",   order: 1 },
  update:  { label: "New version",       order: 2 },
  late:    { label: "Overdue",           order: 3 },
  signoff: { label: "Awaiting sign-off", order: 4 },
  soon:    { label: "Due soon",          order: 5 },
  ok:      { label: "Compliant",         order: 6 },
  na:      { label: "Not applicable",    order: 7 },
};

const state = { data: null, model: null, tab: "overview", emp: null, trn: null, calMonth: null, calFilter: "all", password: null, key: "", confirming: null, signing: null,
  onb: null, onbSel: null, onbFor: "all", onbOpen: true, onbBusy: {}, onbStarting: null, onbErr: null, onbKeep: new Set(), onbDesc: {} };
const $ = (id) => document.getElementById(id);

// ---------- helpers ----------
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function safeUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }
function parseDate(s) { if (!s) return null; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function addMonths(date, n) {
  const y = date.getFullYear(), m = date.getMonth() + n, d = date.getDate();
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(d, last));
}
function dayDiff(a, b) { return Math.round((a - b) / 86400000); }
function fmt(d) { return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : ""; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function initials(name) { return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }
const AV = [["#E0F2FE", "#075985"], ["#FCE7F6", "#9E1F63"], ["#DCF5E7", "#05603A"], ["#FEF0C7", "#93370D"], ["#FDE8D7", "#93370D"], ["#EEEBFF", "#4A1FB8"], ["#E6F4F1", "#0E5E4A"], ["#F2F4F7", "#344054"]];
function avColor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV[h % AV.length]; }
function avatar(name, lg) { const [bg, fg] = avColor(name); return `<span class="av${lg ? " lg" : ""}" style="background:${bg};color:${fg}" aria-hidden="true">${esc(initials(name))}</span>`; }
function plural(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }
function freqText(t) { return t.frequency > 0 ? `Every ${plural(t.frequency, "month")}` : "One-time training"; }

// ---------- model: the compliance logic ----------
function compute(data) {
  const now = today();
  const staff = [...data.staff].sort((a, b) => a.name.localeCompare(b.name));
  const trainings = [...data.trainings].sort((a, b) =>
    (a.roles.includes("All Staff") ? 0 : 1) - (b.roles.includes("All Staff") ? 0 : 1) || a.name.localeCompare(b.name));
  const sById = new Map(staff.map(x => [x.id, x])), tById = new Map(trainings.map(x => [x.id, x]));

  const cells = {};
  for (const x of staff) { cells[x.id] = {}; for (const t of trainings) cells[x.id][t.id] = { status: "na" }; }
  const items = [];
  for (const it of data.items) {
    const st = sById.get(it.staffId), t = tById.get(it.trainingId);
    if (!st || !t) continue;
    const c = {
      status: it.status, staff: st, training: t,
      rec: it.recordUrl ? { url: it.recordUrl } : null,
      done: parseDate(it.done), due: parseDate(it.due), days: it.days,
      score: it.score, attempts: it.attempts, extra: it.extra, version: it.version,
      recordId: it.recordId, signedBy: it.signedBy,
      passMark: t.passMark ?? 80,
    };
    cells[st.id][t.id] = c;
    items.push(c);
  }

  const perStaff = staff.map(s => {
    const mine = items.filter(i => i.staff === s);
    const count = k => mine.filter(i => i.status === k).length;
    return { s, mine, total: mine.length, ok: count("ok"), soon: count("soon"), late: count("late"), missing: count("missing"),
             retake: count("retake"), update: count("update"), signoff: count("signoff") };
  });
  return { staff, trainings, cells, items, perStaff, now };
}

// ---------- detail text ----------
function scoreText(c) { return c.score != null ? ` · scored ${c.score}%` : ""; }
function detail(c) {
  if (c.status === "missing") return "Not yet completed";
  if (c.status === "update") return `Completed ${c.version ? c.version : "an older version"} on ${fmt(c.done)} · current is ${c.training.version}`;
  if (c.status === "signoff") return `Completed ${fmt(c.done)}${scoreText(c)} · waiting for manager sign-off`;
  if (c.status === "retake") return `Scored ${c.score ?? "–"}% on ${fmt(c.done)} · pass mark ${c.passMark}% · ${plural(c.attempts, "attempt")}`;
  if (c.status === "late") return `Overdue ${-c.days}d · due ${fmt(c.due)}`;
  if (c.status === "soon") return c.days === 0 ? `Due today · ${fmt(c.due)}` : `Due in ${c.days}d · ${fmt(c.due)}`;
  if (c.signedBy) return `Completed ${fmt(c.done)}${scoreText(c)} · signed off by ${c.signedBy}${c.due ? ` · next due ${fmt(c.due)}` : ""}`;
  if (c.due) return `Completed ${fmt(c.done)}${scoreText(c)} · next due ${fmt(c.due)}`;
  return `Completed ${fmt(c.done)}${scoreText(c)} (one-time)`;
}

// ---------- views ----------
function viewOverview(m) {
  const n = m.staff.length;
  const full = m.perStaff.filter(p => p.total > 0 && p.ok + p.soon === p.total).length;
  const attention = m.perStaff.filter(p => p.late + p.missing + p.retake + p.update > 0).length;
  const soon = m.items.filter(i => i.status === "soon").length;
  const late = m.items.filter(i => i.status === "late").length;
  const valid = m.items.filter(i => i.status === "ok" || i.status === "soon").length;
  const pct = m.items.length ? Math.round(valid / m.items.length * 100) : 0;
  const pending = m.items.filter(i => i.status === "signoff");
  const retakes = m.items.filter(i => i.status === "retake");
  const overdue = m.items.filter(i => i.status === "late").sort((a, b) => a.days - b.days);

  const rank = s => STATUS[s].order;
  const rows = m.perStaff.map(p => {
    const open = p.mine.filter(i => i.status !== "ok").sort((a, b) => rank(a.status) - rank(b.status) || (a.due || 0) - (b.due || 0));
    const worst = open[0];
    const doneN = p.ok + p.soon;
    return { p, worst, doneN, pct: p.total ? Math.round(doneN / p.total * 100) : 0, r: worst ? rank(worst.status) : 99 };
  }).sort((a, b) => a.r - b.r || a.p.s.name.localeCompare(b.p.s.name));

  const table = `<div class="tbl"><table>
    <thead><tr><th scope="col">Name</th><th scope="col">Progress</th><th scope="col">Status</th><th scope="col">Next item</th></tr></thead>
    <tbody>${rows.map(({ p, worst, doneN, pct }) => `<tr data-emp="${esc(p.s.id)}">
      <td><button class="rowbtn" type="button" data-emp="${esc(p.s.id)}">${avatar(p.s.name)}<span><span class="nm">${esc(p.s.name)}</span><br><span class="role">${esc(p.s.role || "No role")}</span></span></button></td>
      <td><div class="progcell"><span class="bar"><i style="width:${pct}%"></i></span><span>${doneN}/${p.total}</span></div></td>
      <td>${p.total ? `<span class="chip k-${worst ? worst.status : "ok"}">${worst ? STATUS[worst.status].label : "Up to date"}</span>` : `<span class="chip">Nothing assigned</span>`}</td>
      <td>${worst ? `<div class="nextc">${esc(worst.training.name)}<span>${esc(detail(worst))}</span></div>` : `<span class="role">—</span>`}</td>
    </tr>`).join("")}</tbody></table></div>`;

  const todoN = pending.length + retakes.length + overdue.length;
  const todo = todoN ? `<div class="todo">
      ${pending.map(signRow).join("")}
      ${retakes.map(i => todoRow(i, `scored ${i.score ?? "–"}% on <b>${esc(i.training.name)}</b>`, "retake", "Retake required")).join("")}
      ${overdue.map(i => todoRow(i, `· <b>${esc(i.training.name)}</b>`, "late", `Overdue ${-i.days} ${-i.days === 1 ? "day" : "days"}`)).join("")}
    </div>` : `<p class="empty">Nothing needs you right now.</p>`;

  return `
  <section class="stats" aria-label="Summary">
    <div class="stat"><span class="k">Team members</span><span class="v">${n}</span><span class="s">${plural(m.trainings.length, "training")} tracked</span></div>
    <div class="stat"><span class="k">Fully up to date</span><span class="v">${full} <small>of ${n}</small></span><span class="s">${attention ? `${attention} ${attention === 1 ? "person needs" : "people need"} attention` : "Nobody is behind"}</span></div>
    <div class="stat"><span class="k">Need attention</span><span class="v ${late ? "late" : ""}">${late + soon}</span><span class="s">${late} overdue · ${soon} due in ${DUE_SOON_DAYS} days</span></div>
    <div class="stat"><span class="k">Completion</span><span class="v">${pct}%</span><span class="bar"><i style="width:${pct}%"></i></span><span class="s">${valid} of ${m.items.length} items up to date</span></div>
  </section>
  <div class="split">
    <section class="panel" aria-label="People">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2>People</h2><span class="link">Most urgent first · click a name to open</span></div>
      ${n ? table : `<p class="empty">No active staff in the Team database yet.</p>`}
    </section>
    <section class="panel" aria-label="Waiting for you" id="signoff">
      <div><h2>Waiting for you</h2><p class="sub" style="margin:4px 0 0">${todoN ? `${plural(todoN, "thing")} to look at${pending.length && !state.data.canSignOff ? ". Open your Manager Link to sign off." : ""}` : "You're all caught up"}</p></div>
      ${todo}
    </section>
  </div>`;
}

function viewCompliance(m) {
  if (!m.staff.length || !m.trainings.length) return `<p class="empty">Add people and trainings in Notion to see the compliance matrix.</p>`;
  const ok = c => c.status === "ok" || c.status === "soon";
  const perT = m.trainings.map(t => { const xs = m.items.filter(i => i.training === t); return xs.length ? Math.round(xs.filter(ok).length / xs.length * 100) + "%" : "–"; });
  const head = m.trainings.map(t => `<th class="col" scope="col" title="${esc(t.name)}"><span>${esc(t.name)}</span></th>`).join("");
  const rows = m.perStaff.map(p => {
    const pct = p.total ? Math.round((p.ok + p.soon) / p.total * 100) : null;
    return `<tr>
      <td class="who"><button class="rowbtn" type="button" data-emp="${esc(p.s.id)}">${avatar(p.s.name)}<span><span class="nm">${esc(p.s.name)}</span><br><span class="role">${esc(p.s.role || "No role")}</span></span></button></td>
      ${m.trainings.map(t => { const c = m.cells[p.s.id][t.id];
        const tip = c.status === "na" ? `${t.name}: not required` : `${t.name}: ${STATUS[c.status].label} · ${detail(c)}`;
        return `<td><span class="cell st-${c.status}" title="${esc(tip)}" role="img" aria-label="${esc(p.s.name)}, ${esc(tip)}"></span></td>`; }).join("")}
      <td class="pc"><b>${pct == null ? "–" : pct + "%"}</b></td>
    </tr>`; }).join("");
  const full = m.perStaff.filter(p => p.total > 0 && p.ok + p.soon === p.total).length;
  const late = m.items.filter(i => i.status === "late").length;
  const sign = m.items.filter(i => i.status === "signoff").length;
  const valid = m.items.filter(ok).length;
  const pct = m.items.length ? Math.round(valid / m.items.length * 100) : 0;
  return `
  <section class="stats" aria-label="Compliance summary">
    <div class="stat"><span class="k">Compliance rate</span><span class="v">${pct}%</span><span class="bar"><i style="width:${pct}%"></i></span><span class="s">${valid} of ${m.items.length} required items valid</span></div>
    <div class="stat"><span class="k">Fully compliant</span><span class="v">${full} <small>of ${m.staff.length}</small></span><span class="s">People with every required training valid</span></div>
    <div class="stat"><span class="k">Overdue</span><span class="v ${late ? "late" : ""}">${late}</span><span class="s">Expired or past their due date</span></div>
    <div class="stat"><span class="k">Awaiting sign-off</span><span class="v">${sign}</span><span class="s">Completed, waiting for a manager</span></div>
  </section>
  <section class="panel" aria-label="Compliance matrix">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2>Compliance matrix</h2><span class="link">Every person × every training · hover a square for details</span></div>
    <div class="legend">
      <span><i class="cell st-ok"></i>Compliant</span><span><i class="cell st-soon"></i>Due soon</span><span><i class="cell st-late"></i>Overdue</span>
      <span><i class="cell st-missing"></i>Not completed</span><span><i class="cell st-retake"></i>Retake required</span><span><i class="cell st-update"></i>New version</span>
      <span><i class="cell st-signoff"></i>Awaiting sign-off</span><span><i class="cell st-na"></i>Not required</span>
    </div>
    <div class="mx"><table>
      <thead><tr><th></th>${head}<th class="pc" scope="col">Compliant</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="who">Compliant per training</td>${perT.map(x => `<td>${x}</td>`).join("")}<td class="pc">${pct}%</td></tr></tfoot>
    </table></div>
  </section>`;
}

function todoRow(i, what, k, label) {
  const u = i.rec ? safeUrl(i.rec.url) : null;
  return `<div>
    <div class="tt"><b>${esc(i.staff.name)}</b> ${what}</div>
    <div class="ta"><span class="chip k-${k}">${esc(label)}</span>${u ? `<a class="btn small" href="${esc(u)}" target="_blank" rel="noopener">Open record</a>` : `<button class="btn small" type="button" data-emp="${esc(i.staff.id)}">Open person</button>`}</div>
  </div>`;
}

function signRow(i) {
  const u = i.rec ? safeUrl(i.rec.url) : null;
  const me = state.data.me;
  const own = me && i.staff.id === me.id;
  let acts = "";
  if (state.data.canSignOff && i.recordId) {
    if (own) acts = `<span class="link">Another manager signs off your own training</span>`;
    else if (state.signing === i.recordId) acts = `<button class="btn small" type="button" disabled>Signing off…</button>`;
    else if (state.confirming === i.recordId) acts = `<span class="link">Sign off as ${esc(me.name)}?</span><button class="btn small ok" type="button" data-sign="${esc(i.recordId)}">Confirm</button><button class="btn small" type="button" data-cancel>Cancel</button>`;
    else acts = `<button class="btn small ok" type="button" data-ask="${esc(i.recordId)}">Sign off</button>`;
  }
  return `<div class="signrow">
    <div class="tt"><b>${esc(i.staff.name)}</b> finished <b>${esc(i.training.name)}</b>${i.score != null ? ` · ${i.score}%` : ""}</div>
    <div class="ta"><span class="chip k-signoff">Awaiting sign-off</span><span class="acts">${u ? `<a class="link" href="${esc(u)}" target="_blank" rel="noopener">View</a>` : ""}${acts}</span></div>
  </div>`;
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

async function signOff(recordId) {
  state.signing = recordId; state.confirming = null; render();
  try {
    const r = await fetch("/api/dashboard", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: state.key, recordId }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "The sign-off couldn't be saved.");
    toast(`Signed off by ${res.signedBy}`);
  } catch (e) {
    toast(e.message);
  }
  state.signing = null;
  await load();
}

function itemCard(c, titleText) {
  const u = c.rec ? safeUrl(c.rec.url) : null;
  const tag = u ? "a" : "div";
  return `<${tag} class="item k-${c.status}"${u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ""}>
    <span class="t">${esc(titleText)}</span><span class="d">${esc(detail(c))}</span>
    ${c.extra ? `<span class="chip extra">Assigned individually</span>` : ""}
  </${tag}>`;
}

function groups(list, renderOne) {
  const order = ["missing", "retake", "update", "late", "signoff", "soon", "ok"];
  return order.map(k => {
    const g = list.filter(c => c.status === k);
    if (!g.length) return "";
    return `<div class="group"><h3><i class="sw st-${k}"></i>${STATUS[k].label} (${g.length})</h3>${renderOne(g)}</div>`;
  }).join("");
}

function viewEmployees(m) {
  if (!m.staff.length) return `<p class="empty">No active staff in the Team database yet.</p>`;
  if (!state.emp || !m.cells[state.emp]) state.emp = m.staff[0].id;
  const p = m.perStaff.find(x => x.s.id === state.emp);
  const s = p.s;
  const pct = p.total ? Math.round((p.ok + p.soon) / p.total * 100) : 0;
  const opts = m.staff.map(x => `<option value="${esc(x.id)}"${x.id === s.id ? " selected" : ""}>${esc(x.name)}</option>`).join("");
  const sorted = [...p.mine].sort((a, b) => a.training.name.localeCompare(b.training.name));
  return `
  <div class="pick"><label for="empSelect">Person</label><select id="empSelect">${opts}</select></div>
  <section class="panel">
    <div class="profile">${avatar(s.name, true)}<div><h2>${esc(s.name)}</h2><div class="role">${esc(s.role || "No role")}${s.hireDate ? ` · hired ${fmt(parseDate(s.hireDate))}` : ""}</div></div></div>
    <div class="facts"><span><b>${p.total}</b> trainings tracked</span><span><b>${p.ok}</b> on track</span><span><b>${p.total - p.ok}</b> need attention</span><span><b>${pct}%</b> completion rate</span></div>
    ${p.total ? groups(sorted, g => `<div class="items">${g.map(c => itemCard(c, c.training.name)).join("")}</div>`) : `<p class="empty">No trainings apply to this role.</p>`}
  </section>`;
}

function viewTrainings(m) {
  if (!m.trainings.length) return `<p class="empty">No trainings in the Trainings database yet.</p>`;
  if (!state.trn || !m.trainings.some(t => t.id === state.trn)) state.trn = m.trainings[0].id;
  const t = m.trainings.find(x => x.id === state.trn);
  const list = m.items.filter(i => i.training === t).sort((a, b) => a.staff.name.localeCompare(b.staff.name));
  const count = k => list.filter(i => i.status === k).length;
  const opts = m.trainings.map(x => `<option value="${esc(x.id)}"${x.id === t.id ? " selected" : ""}>${esc(x.name)}</option>`).join("");
  const appliesTo = t.roles.includes("All Staff") ? "all staff" : t.roles.join(", ") || "no roles";
  return `
  <div class="pick"><label for="trnSelect">Training</label><select id="trnSelect">${opts}</select></div>
  <section class="panel">
    <div><h2>${esc(t.name)}</h2><div class="role">${esc(freqText(t))} · ${t.completion === "Quiz" ? `quiz, pass mark ${t.passMark ?? 80}%` : "read & confirm"}${t.needsSignoff ? " + manager sign-off" : ""}${t.version ? ` · ${esc(t.version)}` : ""} · for ${esc(appliesTo)} · applies to ${list.length} of ${m.staff.length} staff${t.category ? ` · ${esc(t.category)}` : ""}</div></div>
    <div class="facts"><span><b>${count("ok")}</b> on track</span><span><b>${count("soon")}</b> due soon</span><span><b>${count("late")}</b> overdue</span><span><b>${count("retake")}</b> retake required</span><span><b>${count("update")}</b> new version</span><span><b>${count("signoff")}</b> awaiting sign-off</span><span><b>${count("missing")}</b> not completed</span></div>
    ${list.length ? groups(list, g => `<div class="people">${g.map(c => {
      const u = c.rec ? safeUrl(c.rec.url) : null; const tag = u ? "a" : "div";
      return `<${tag} class="person"${u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ""}><span class="l">${avatar(c.staff.name)}<span><span class="nm">${esc(c.staff.name)}</span><br><span class="role">${esc(c.staff.role || "")}</span></span></span><span class="d">${esc(detail(c))}</span></${tag}>`;
    }).join("")}</div>`) : `<p class="empty">This training doesn't apply to any current staff.</p>`}
  </section>`;
}

function viewCalendar(m) {
  const now = m.now;
  if (!state.calMonth) state.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const month = state.calMonth;
  const dated = m.items.filter(i => i.due);
  const within = d => dated.filter(i => i.days >= 0 && i.days <= d).length;
  const late = dated.filter(i => i.days < 0);

  const f = state.calFilter;
  const inFilter = i =>
    f === "late" ? i.days < 0 :
    f === "30" ? i.days >= 0 && i.days <= 30 :
    f === "60" ? i.days >= 0 && i.days <= 60 :
    f === "90" ? i.days >= 0 && i.days <= 90 : true;
  const shown = dated.filter(inFilter);

  const byDay = new Map();
  for (const i of shown) { const k = iso(i.due); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(i); }

  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  let cellsHtml = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    if (k >= 35 && d.getMonth() !== month.getMonth()) break;
    const evs = byDay.get(iso(d)) || [];
    const out = d.getMonth() !== month.getMonth();
    const isToday = iso(d) === iso(now);
    cellsHtml += `<div class="day${out ? " out" : ""}${isToday ? " today" : ""}"><span class="n">${d.getDate()}</span><div class="evs">${
      evs.slice(0, 3).map(i => `<span class="ev k-${i.status}" title="${esc(`${i.staff.name} — ${i.training.name}: ${detail(i)}`)}">${esc(i.staff.name.split(" ")[0])} · ${esc(i.training.name)}</span>`).join("")
    }${evs.length > 3 ? `<span class="more">+${evs.length - 3} more</span>` : ""}</div></div>`;
  }

  const inMonth = i => i.due.getMonth() === month.getMonth() && i.due.getFullYear() === month.getFullYear();
  const agendaList = (f === "all" ? shown.filter(inMonth) : shown).sort((a, b) => a.due - b.due);
  const monthName = month.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const fb = (k, label) => `<button data-filter="${k}" aria-pressed="${f === k}">${label}</button>`;

  return `
  <section class="stats" aria-label="Upcoming">
    <div class="stat"><span class="k">Overdue</span><span class="v late">${late.length}</span><span class="s">Past their due date</span></div>
    <div class="stat"><span class="k">Due in 7 days</span><span class="v soon">${within(7)}</span><span class="s">By ${fmt(new Date(now.getTime() + 7 * 864e5))}</span></div>
    <div class="stat"><span class="k">Due in 30 days</span><span class="v soon">${within(30)}</span><span class="s">By ${fmt(new Date(now.getTime() + 30 * 864e5))}</span></div>
    <div class="stat"><span class="k">Due in 90 days</span><span class="v">${within(90)}</span><span class="s">By ${fmt(new Date(now.getTime() + 90 * 864e5))}</span></div>
  </section>
  <section class="panel">
    <div class="calbar">
      <div class="calnav">
        <button class="btn" data-cal="prev" aria-label="Previous month">‹</button>
        <h2>${esc(monthName)}</h2>
        <button class="btn" data-cal="next" aria-label="Next month">›</button>
        <button class="btn" data-cal="today">Today</button>
      </div>
      <div class="filters" role="group" aria-label="Filter">${fb("all","All")}${fb("late","Overdue")}${fb("30","Next 30d")}${fb("60","Next 60d")}${fb("90","Next 90d")}</div>
    </div>
    <div class="cal">${cellsHtml}</div>
  </section>
  <section class="panel">
    <h2>${f === "all" ? `Due in ${esc(monthName)}` : f === "late" ? "Overdue" : `Due in the next ${f} days`}</h2>
    ${agendaList.length ? `<div class="agenda">${agendaList.map(i => {
      const u = i.rec ? safeUrl(i.rec.url) : null; const tag = u ? "a" : "div";
      return `<${tag} class="row"${u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ""}><span class="date">${fmt(i.due)}</span><span class="what"><b>${esc(i.staff.name)}</b> · ${esc(i.training.name)}</span><span class="badge k-${i.status}">${i.status === "late" ? `${-i.days}d late` : i.status === "soon" ? `in ${i.days}d` : "On track"}</span></${tag}>`;
    }).join("")}</div>` : `<p class="empty">Nothing due ${f === "all" ? "this month" : "in this range"}.</p>`}
  </section>`;
}


// ---------- onboarding ----------
const TASK_LABEL = { late: "Overdue", soon: "Due soon", open: "", done: "" };
function viewOnboarding() {
  const d = state.onb;
  if (state.onbErr) return `<div class="notice"><h2>Onboarding couldn't load.</h2><p>${esc(state.onbErr)}</p><button class="primary" type="button" data-onb-reload>Try again</button></div>`;

  const lateTasks = people.reduce((n, p) => n + p.all.late, 0);

      <span class="prog">${p.started ? `<span style="display:flex;justify-content:space-between"><span>New hire <b>${p.newHire.done}/${p.newHire.total}</b> · HR <b>${p.hr.done}/${p.hr.total}</b></span><b>${p.all.done} of ${p.all.total} done</b></span><span class="bar" style="height:8px"><i style="width:${pct}%"></i></span>` : `<span>No tasks yet. Open to start their onboarding.</span>`}</span>

    <div class="stat"><span class="k">Overdue tasks</span><span class="v ${lateTasks ? "late" : ""}">${lateTasks}</span><span class="s">Past their due date</span></div>
    <div class="stat"><span class="k">HR tasks for you</span><span class="v">${forMe}</span><span class="s">${d.me.isAdmin ? "You're an admin" : "For people you onboard"}</span></div>
    <div class="stat"><span class="k">Not started</span><span class="v">${people.filter(p => !p.started).length}</span><span class="s">Need their tasks created</span></div>

}

function onboardingDetail(p) {
  const head = `<div class="profile">${avatar(p.name, true)}<div><h2>${esc(p.name)}</h2><div class="role">${esc(p.role || "No role")}${p.hireDate ? ` · starts ${fmt(parseDate(p.hireDate))}` : ""} · onboarding manager: ${p.manager ? esc(p.manager) : "not set"}</div></div></div>`;
  if (!p.started) {
    let action;
    if (state.onbStarting && state.onbStarting.id === p.id) action = `<button class="btn" type="button" disabled>Creating tasks… ${state.onbStarting.made} so far</button>`;
    else if (!p.canManage) action = `<p class="empty">Their onboarding manager${p.manager ? ` (${esc(p.manager)})` : ""} or an admin starts this.</p>`;
    else if (!p.hireDate) action = `<p class="empty">Add a Hire Date on ${esc(p.name)}'s row in Notion first. Due dates are worked out from it.</p>`;
    else action = `<button class="primary" type="button" data-onb-start="${esc(p.id)}">Start onboarding</button><p class="sub" style="margin:0">Creates ${esc(p.name.split(" ")[0])}'s New hire and HR &amp; Compliance tasks for the ${esc(p.role || "All Staff")} role, with due dates from their start date.</p>`;
    return `<section class="panel">${head}${action}</section>`;
  }
  const f = state.onbFor;
  let tasks = p.tasks.filter(t => f === "all" || (f === "hr" ? t.for === "HR & Compliance" : t.for !== "HR & Compliance"));
  const keep = t => !t.doneOn || state.onbKeep.has(t.id);
  const hiddenDone = state.onbOpen ? tasks.filter(t => !keep(t)).length : 0;
  if (state.onbOpen) tasks = tasks.filter(keep);
  const phases = [...new Set(tasks.map(t => t.phase || "Other"))];
  const fb = (k, label) => `<button data-onb-for="${k}" aria-pressed="${f === k}">${label}</button>`;
  return `<section class="panel">
    ${head}
    <div class="facts"><span><b>${p.all.done}/${p.all.total}</b> done</span><span><b>${p.all.late}</b> overdue</span><span>New hire <b>${p.newHire.done}/${p.newHire.total}</b></span><span>HR &amp; Compliance <b>${p.hr.done}/${p.hr.total}</b></span></div>
    <div class="calbar">
      <div class="filters" role="group" aria-label="Whose tasks">${fb("all", "All")}${fb("hr", "HR &amp; Compliance")}${fb("nh", "New hire")}</div>
      <div class="filters" role="group" aria-label="Show"><button data-onb-open="1" aria-pressed="${state.onbOpen}">Still to do</button><button data-onb-open="0" aria-pressed="${!state.onbOpen}">Everything</button></div>
    </div>
    ${!p.canManage ? `<p class="sub" style="margin:0">View only. ${p.manager ? esc(p.manager) : "Their onboarding manager"} or an admin ticks these off.</p>` : ""}
    ${tasks.length ? phases.map(ph => `<div class="phase"><h3>${esc(ph)}</h3>${tasks.filter(t => (t.phase || "Other") === ph).map(t => taskRow(t, p)).join("")}</div>`).join("")
      : `<p class="empty">${hiddenDone ? "Everything here is done." : "No tasks in this list."}</p>`}
    ${hiddenDone && tasks.length ? `<p class="link">${hiddenDone} done ${hiddenDone === 1 ? "task" : "tasks"} hidden · <button class="btn small" type="button" data-onb-open="0">Show everything</button></p>` : ""}
  </section>`;
}

function taskRow(t, p) {
  const busy = state.onbBusy[t.id];
  const meta = [t.owner ? `Owner: ${esc(t.owner)}` : "", t.doneOn ? `Done ${fmt(parseDate(t.doneOn))}${t.doneBy ? ` by ${esc(t.doneBy)}` : ""}` : t.due ? `Due ${fmt(parseDate(t.due))}` : "No due date",
    t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">Open link</a>` : ""].filter(Boolean).join(" · ");
  const st = t.doneOn ? "" : t.state === "late" ? `<span class="tag late">Overdue</span>` : t.state === "soon" ? `<span class="tag soon">Due soon</span>` : "";
  return `<div class="task${t.doneOn ? " is-done" : ""}">
    <input type="checkbox" data-onb-task="${esc(t.id)}" data-person="${esc(p.id)}" ${t.doneOn ? "checked" : ""} ${!p.canManage || busy ? "disabled" : ""} aria-label="${esc(t.name)}">
    <div><div class="tn"><button type="button" data-onb-desc="${esc(t.id)}" aria-expanded="${!!state.onbDesc[t.id]}">${esc(t.name)}</button></div><div class="tm">${meta}${t.notes ? ` · ${esc(t.notes)}` : ""}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${st}<span class="tag ${t.for === "HR & Compliance" ? "hr" : "nh"}">${t.for === "HR & Compliance" ? "HR" : "New hire"}</span></div>
    ${state.onbDesc[t.id] ? `<div class="desc">${state.onbDesc[t.id] === "loading" ? `<span class="link">Loading description…</span>` : state.onbDesc[t.id]}</div>` : ""}
  </div>`;
}

// Notion blocks -> simple HTML for task descriptions
function rtx(arr) {
  return (arr || []).map(t => {
    let h = esc(t.text).replace(/\n/g, "<br>");
    if (t.code) h = `<code>${h}</code>`; if (t.b) h = `<strong>${h}</strong>`; if (t.i) h = `<em>${h}</em>`; if (t.s) h = `<s>${h}</s>`;
    if (t.href && safeUrl(t.href)) h = `<a href="${esc(t.href)}" target="_blank" rel="noopener">${h}</a>`;
    return h;
  }).join("");
}
function descBlocks(list) {
  let out = "", i = 0;
  while (i < (list || []).length) {
    const b = list[i];
    if (b.type === "bulleted_list_item" || b.type === "numbered_list_item") {
      const tag = b.type === "bulleted_list_item" ? "ul" : "ol"; out += `<${tag}>`;
      while (i < list.length && list[i].type === b.type) { out += `<li>${rtx(list[i].text)}${descBlocks(list[i].children)}</li>`; i++; }
      out += `</${tag}>`; continue;
    }
    const kids = descBlocks(b.children);
    switch (b.type) {
      case "paragraph": out += b.text && b.text.length ? `<p>${rtx(b.text)}</p>${kids}` : ""; break;
      case "heading_1": case "heading_2": out += `<h4>${rtx(b.text)}</h4>`; break;
      case "heading_3": out += `<h5>${rtx(b.text)}</h5>`; break;
      case "to_do": out += `<p>${b.checked ? "☑" : "☐"} ${rtx(b.text)}</p>${kids}`; break;
      case "callout": out += `<div class="call">${b.icon ? esc(b.icon) + " " : ""}${rtx(b.text)}${kids}</div>`; break;
      case "toggle": out += `<details><summary>${rtx(b.text)}</summary>${kids}</details>`; break;
      case "quote": out += `<blockquote>${rtx(b.text)}${kids}</blockquote>`; break;
      case "divider": out += "<hr>"; break;
      case "column_list": out += (b.children || []).map(c => descBlocks(c.children)).join(""); break;
      case "image": out += safeUrl(b.src) ? `<img src="${esc(b.src)}" alt="">` : ""; break;
      case "bookmark": case "embed": case "video": case "pdf": case "file": case "link_preview":
        out += safeUrl(b.href) ? `<p><a href="${esc(b.href)}" target="_blank" rel="noopener">${b.caption && b.caption.length ? rtx(b.caption) : "Open the attachment"} ↗</a></p>` : ""; break;
      default: out += kids;
    }
    i++;
  }
  return out;
}
async function toggleDesc(id) {
  if (state.onbDesc[id]) { delete state.onbDesc[id]; return render(); }
  state.onbDesc[id] = "loading"; render();
  try {
    const r = await fetch(`/api/onboarding?key=${encodeURIComponent(state.key)}&task=${encodeURIComponent(id)}`, { cache: "no-store" });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "Couldn't load the description.");
    const html = descBlocks(res.blocks);
    state.onbDesc[id] = html || `<span class="link">No description yet. Add one in the body of this task's page in the Onboarding Task Library.</span>`;
  } catch (e) { state.onbDesc[id] = `<span class="link">${esc(e.message)}</span>`; }
  render();
}

async function loadOnboarding() {
  try {
    const r = await fetch("/api/onboarding?view=team&key=" + encodeURIComponent(state.key), { cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.message || "Couldn't load onboarding from Notion.");
    state.onb = body; state.onbErr = null;
  } catch (e) { if (!state.onb) state.onbErr = e.message; else toast(e.message); }
  updateHireCount();
  if (state.tab === "onboarding") render();
}
function updateHireCount() {
  const c = $("hireCount"); if (!c || !state.onb) return;
  const n = state.onb.people.filter(p => !p.started || p.all.done < p.all.total).length;
  c.hidden = !n; c.textContent = n;
}

async function onbPost(payload) {
  const r = await fetch("/api/onboarding", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: state.key, ...payload }) });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(res.message || "That couldn't be saved.");
  return res;
}

async function startOnboarding(personId) {
  state.onbStarting = { id: personId, made: 0 }; render();
  try {
    for (let i = 0; i < 20; i++) {
      const res = await onbPost({ action: "start", personId });
      state.onbStarting.made += res.created; render();
      if (!res.remaining) break;
    }
    toast(`Onboarding started · ${state.onbStarting.made} tasks created`);
  } catch (e) { toast(e.message); }
  state.onbStarting = null;
  await loadOnboarding();
}

async function toggleTask(box) {
  const id = box.dataset.onbTask, done = box.checked;
  const p = state.onb.people.find(x => x.id === box.dataset.person);
  const t = p && p.tasks.find(x => x.id === id);
  if (!t) return;
  state.onbBusy[id] = true;
  state.onbKeep.add(id);
  const before = { doneOn: t.doneOn, doneBy: t.doneBy };
  t.doneOn = done ? iso(today()) : null; t.doneBy = done ? (state.onb.me.name) : null;
  render();
  try { await onbPost({ action: done ? "done" : "undo", taskId: id }); }
  catch (e) { Object.assign(t, before); toast(e.message); }
  delete state.onbBusy[id];
  await loadOnboarding();
}

// ---------- render ----------
const TITLES = {
  compliance: ["Training compliance", "Who is compliant on which training, at a glance."],
  overview: ["Training overview", "Who's up to date, who needs a nudge, and what's waiting for you."],
  employees: ["People", "One person's trainings, grouped by what needs doing."],
  trainings: ["Trainings", "One training and where everyone stands on it."],
  calendar: ["Calendar", "What's due and when."],
  onboarding: ["New hires", "Everyone joining, their checklist and what HR still owes them."],
};
function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const [t, sub] = TITLES[state.tab] || TITLES.overview;
  $("pageTitle").textContent = t; $("pageSub").textContent = sub;
  if (!state.model) return;
  const v = $("view");
  const html = state.tab === "employees" ? viewEmployees(state.model)
    : state.tab === "trainings" ? viewTrainings(state.model)
    : state.tab === "calendar" ? viewCalendar(state.model)
    : state.tab === "compliance" ? viewCompliance(state.model)
    : state.tab === "onboarding" ? viewOnboarding()
    : viewOverview(state.model);
  v.innerHTML = html;
}

function setTab(tab) {
  state.tab = tab;
  if (tab === "onboarding" && !state.onb) loadOnboarding();
  try { history.replaceState(null, "", "#" + tab); } catch {}
  render();
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) return setTab(tab.dataset.tab);
  const emp = e.target.closest("[data-emp]");
  if (emp) { state.emp = emp.dataset.emp; return setTab("employees"); }
  const cal = e.target.closest("[data-cal]");
  if (cal) {
    const m = state.calMonth;
    if (cal.dataset.cal === "prev") state.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    if (cal.dataset.cal === "next") state.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    if (cal.dataset.cal === "today") { const n = today(); state.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
    return render();
  }
  const fl = e.target.closest("[data-filter]");
  if (fl) { state.calFilter = fl.dataset.filter; return render(); }
  const ask = e.target.closest("[data-ask]");
  if (ask) { state.confirming = ask.dataset.ask; return render(); }
  if (e.target.closest("[data-cancel]")) { state.confirming = null; return render(); }
  const sign = e.target.closest("[data-sign]");
  if (sign) return signOff(sign.dataset.sign);
  const onb = e.target.closest("[data-onb]");
  if (onb) { state.onbSel = onb.dataset.onb; state.onbKeep.clear(); return render(); }
  const of = e.target.closest("[data-onb-for]");
  if (of) { state.onbFor = of.dataset.onbFor; state.onbKeep.clear(); return render(); }
  const oo = e.target.closest("[data-onb-open]");
  if (oo) { state.onbOpen = oo.dataset.onbOpen === "1"; state.onbKeep.clear(); return render(); }
  const od = e.target.closest("[data-onb-desc]");
  if (od) return toggleDesc(od.dataset.onbDesc);
  const os = e.target.closest("[data-onb-start]");
  if (os) return startOnboarding(os.dataset.onbStart);
  if (e.target.closest("[data-onb-reload]")) { state.onbErr = null; render(); return loadOnboarding(); }
});
document.addEventListener("change", (e) => {
  if (e.target.matches("[data-onb-task]")) return toggleTask(e.target);
  if (e.target.id === "empSelect") { state.emp = e.target.value; render(); }
  if (e.target.id === "trnSelect") { state.trn = e.target.value; render(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "pwForm") {
    e.preventDefault();
    state.password = $("pw").value;
    try { sessionStorage.setItem("dash-pw", state.password); } catch {}
    load();
  }
});

// ---------- data loading ----------
function setFresh(kind, text) {
  $("dot").className = "dot" + (kind === "ok" ? "" : kind === "warn" ? " warn" : " err");
  $("freshText").innerHTML = text;
}

function showLogin(body, wrong) {
  $("who").hidden = true;
  $("view").innerHTML = `<div class="notice">
    <h2>Managers only</h2>
    <p>${esc(body.message || "Open your Manager Link from Notion.")}</p>
    <p class="sub">Your Manager Link is on your row in the Team database in Notion.</p>
  </div>${body.passwordAllowed && !state.key ? passwordForm(wrong) : ""}`;
  setFresh("warn", "Sign-in needed");
}

function passwordForm(wrong) {
  return `<form class="notice" id="pwForm">
    <h2>Or view with the dashboard password</h2>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    ${wrong ? `<span class="err">That password didn't work. Check it and try again.</span>` : ""}
    <button class="primary" type="submit">Open dashboard (view only)</button>
  </form>`;
}

function accept(data) {
  state.data = data;
  state.model = compute(data);
  $("grp-onboarding").hidden = !data.onboarding;
  if (!data.onboarding && state.tab === "onboarding") state.tab = "overview";
  if (data.onboarding && (state.tab === "onboarding" || !state.onb) && !Object.keys(state.onbBusy).length && !state.onbStarting) loadOnboarding();
  render();
}

async function load() {
  if (SNAPSHOT) {
    accept(SNAPSHOT);
    const at = new Date(SNAPSHOT.generatedAt);
    setFresh("warn", `Preview · snapshot of Notion taken ${esc(fmt(at))}, ${esc(at.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }))}. The deployed app reads Notion live.`);
    return;
  }
  try {
    const headers = state.password && !state.key ? { "x-dashboard-password": state.password } : {};
    const r = await fetch("/api/dashboard" + (state.key ? "?key=" + encodeURIComponent(state.key) : ""), { headers, cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { state.model = null; return showLogin(body, !!state.password); }
    if (!r.ok) throw new Error(body.message || "Couldn't load data from Notion.");
    accept(body);
    const who = $("who"); who.hidden = false;
    who.innerHTML = body.me
      ? `<a class="btn small" href="/me.html?key=${encodeURIComponent(state.key)}">My own view</a>${avatar(body.me.name)}<span class="wn"><b>${esc(body.me.name)}</b><span>${body.me.isAdmin ? "Admin" : "Manager"}</span></span>`
      : `<span class="chip">View only</span>`;
    setFresh("ok", `Synced with Notion · ${esc(new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }))}`);
  } catch (err) {
    if (state.model) setFresh("err", `Couldn't refresh · showing data from earlier. ${esc(err.message)}`);
    else {
      setFresh("err", "Couldn't load data");
      $("view").innerHTML = `<div class="notice"><h2>The dashboard couldn't reach Notion.</h2><p>${esc(err.message)}</p><button class="primary" type="button" id="retry">Try again</button></div>`;
      $("retry").addEventListener("click", load);
    }
  }
}

async function loadBrand() {
  try {
    const r = await fetch("/api/brand");
    if (!r.ok) return;
    const b = await r.json();
    if (b.color) document.documentElement.style.setProperty("--brand", b.color);
    $("brandName").textContent = b.name;
    document.title = `${b.name} · Team Portal`;
    const mark = $("brandMark");
    if (b.logo) mark.innerHTML = `<img src="${esc(b.logo)}" alt="">`; else mark.textContent = initials(b.name).slice(0, 1);
    const ic = document.querySelector('link[rel="icon"]');
    if (ic && b.color) ic.href = `data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='${b.color}'/></svg>`)}`;
  } catch {}
}

(function start() {
  loadBrand();
  const h = (location.hash || "").slice(1);
  if (["overview", "compliance", "employees", "trainings", "calendar", "onboarding"].includes(h)) state.tab = h;
  try { state.password = sessionStorage.getItem("dash-pw"); } catch {}
  state.key = new URLSearchParams(location.search).get("key") || "";
  render();
  load();
  if (!SNAPSHOT) setInterval(() => { if (document.visibilityState === "visible") load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!SNAPSHOT && document.visibilityState === "visible") load(); });
})();
</script>
