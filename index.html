<!doctype html>
<html lang="en">
<title>Training Compliance Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: clinic-office ledger — header and tab bar, then one view at a time; status colour is the main signal */
  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --surface-2: #eef0ec;
    --fg: #1b231f;
    --muted: #5d6963;
    --line: #dde2dd;
    --accent: #2c6a52;
    --accent-ink: #ffffff;
    --ok: #3d8a63;     --ok-soft: #e1f0e7;
    --soon: #b07a23;   --soon-soft: #f7ecd6;
    --late: #b5443d;   --late-soft: #f8e3e1;
    --miss: #74559f;   --miss-soft: #ece5f5;
    --retake: #2f6fae; --retake-soft: #e2ecf8;
    --update: #b0447a; --update-soft: #f8e2ee;
    --na: #c9cec9;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111614; --surface: #19201d; --surface-2: #222a26; --fg: #e5ebe7; --muted: #9aa7a0; --line: #2c3631;
      --accent: #6cbf98; --accent-ink: #0f1a15;
      --ok: #6cc595; --ok-soft: #1c3227; --soon: #e0b062; --soon-soft: #362b17;
      --late: #ec8a82; --late-soft: #3a1f1d; --miss: #b49ae0; --miss-soft: #2b2338; --retake: #8ab8ec; --retake-soft: #1b2a3d; --update: #ee9cc6; --update-soft: #3a1f2e; --na: #3a4540;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111614; --surface: #19201d; --surface-2: #222a26; --fg: #e5ebe7; --muted: #9aa7a0; --line: #2c3631;
    --accent: #6cbf98; --accent-ink: #0f1a15;
    --ok: #6cc595; --ok-soft: #1c3227; --soon: #e0b062; --soon-soft: #362b17;
    --late: #ec8a82; --late-soft: #3a1f1d; --miss: #b49ae0; --miss-soft: #2b2338; --retake: #8ab8ec; --retake-soft: #1b2a3d; --update: #ee9cc6; --update-soft: #3a1f2e; --na: #3a4540;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 56px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .head { display: flex; gap: 14px; align-items: flex-start; }
  .logo { width: 44px; height: 44px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
  .logo svg { width: 22px; height: 22px; }
  .head h1 { font: 600 clamp(24px, 4vw, 30px)/1.15 var(--display); margin: 0; text-wrap: balance; }
  .head p { margin: 2px 0 0; color: var(--muted); max-width: 62ch; }
  .fresh { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  #view { display: grid; gap: 16px; min-width: 0; }
  .fresh .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; transform: translateY(-1px); }
  .fresh .dot.warn { background: var(--soon); }
  .fresh .dot.err { background: var(--late); }
  .who { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .who b { color: var(--fg); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
  .signrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); flex-wrap: wrap; }
  .signrow .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .link { font-size: 13px; color: var(--muted); }
  .fresh code { font-family: var(--mono); font-size: 12px; }

  /* Tabs */
  .tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; justify-self: start; max-width: 100%; }
  .tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

  /* Cards and stats */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 4px; align-content: start; }
  .stat .k { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stat .v { font: 600 32px/1 var(--display); font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 13px; color: var(--muted); }
  .v.ok { color: var(--ok); } .v.soon { color: var(--soon); } .v.late { color: var(--late); } .v.miss { color: var(--miss); } .v.retake { color: var(--retake); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
  .panel h2 { font: 600 19px/1.25 var(--display); margin: 0; }
  .panel .sub { color: var(--muted); margin: -8px 0 0; font-size: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
  .st-ok { background: var(--ok); } .st-soon { background: var(--soon); } .st-late { background: var(--late); }
  .st-missing { background: var(--miss); } .st-retake { background: var(--retake); } .st-update { background: var(--update); }
  .st-signoff { background: transparent; box-shadow: inset 0 0 0 3px var(--ok); } .st-na { background: var(--na); }

  /* Heatmap */
  .scroll-x { overflow-x: auto; }
  table.heat { border-collapse: separate; border-spacing: 0; width: auto; }
  .heat th, .heat td { padding: 0; }
  .heat thead th { vertical-align: bottom; padding: 0 4px 10px; }
  .heat thead th.col { width: 40px; }
  .heat thead th.col span {
    writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap;
    font-size: 12px; color: var(--muted); font-weight: 500; display: inline-block; max-height: 190px; overflow: hidden; text-overflow: ellipsis;
  }
  .heat tbody tr { border-top: 1px solid var(--line); }
  .heat tbody td { border-top: 1px solid var(--line); height: 52px; text-align: center; }
  .heat td.who { text-align: left; padding-right: 24px; min-width: 210px; }
  .rowbtn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 6px 0; cursor: pointer; text-align: left; width: 100%; }
  .rowbtn:hover .nm { color: var(--accent); }
  .nm { font-weight: 600; line-height: 1.2; }
  .role { font-size: 12px; color: var(--muted); }
  .cell { width: 24px; height: 24px; border-radius: 6px; display: inline-block; vertical-align: middle; }
  .cell.st-na { background: transparent; border: 1px dashed var(--na); }

  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 13px; flex: none; letter-spacing: .02em; }
  .av.lg { width: 48px; height: 48px; font-size: 16px; }

  /* Lists */
  .group { display: grid; gap: 8px; }
  .group h3 { font-size: 13px; font-weight: 600; margin: 4px 0 0; display: flex; align-items: center; gap: 8px; }
  .group h3 .sw { border-radius: 50%; width: 9px; height: 9px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .item {
    display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--na);
    border-radius: 0 8px 8px 0; background: var(--surface-2); color: inherit; text-decoration: none; min-width: 0;
  }
  a.item:hover { border-color: var(--accent); border-left-color: inherit; }
  .item.k-ok { border-left-color: var(--ok); } .item.k-soon { border-left-color: var(--soon); }
  .item.k-late { border-left-color: var(--late); } .item.k-missing { border-left-color: var(--miss); } .item.k-retake { border-left-color: var(--retake); } .item.k-update { border-left-color: var(--update); } .item.k-signoff { border-left-color: var(--ok); }
  .item .t { font-weight: 600; overflow-wrap: anywhere; }
  .item .d { font: 12.5px/1.4 var(--mono); color: var(--muted); }
  .chip.extra { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soon-soft); color: var(--soon); justify-self: start; margin-top: 4px; }

  .people { display: grid; gap: 6px; }
  .person { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); color: inherit; text-decoration: none; flex-wrap: wrap; }
  .person .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .person .d { font: 12.5px/1.4 var(--mono); color: var(--muted); }

  .pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pick label { font-size: 13px; color: var(--muted); font-weight: 500; }
  select { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }

  .profile { display: flex; gap: 14px; align-items: center; }
  .profile h2 { font-size: 22px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
  .facts b { color: var(--fg); font-variant-numeric: tabular-nums; }

  /* Calendar */
  .calbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .calnav { display: flex; gap: 8px; align-items: center; }
  .calnav h2 { min-width: 9.5em; text-align: center; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: var(--accent); }
  .filters { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
  .filters button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .dow { font-size: 12px; color: var(--muted); text-align: center; font-weight: 500; padding-bottom: 2px; }
  .day { min-height: 92px; border-radius: 8px; background: var(--surface-2); padding: 6px; display: grid; align-content: start; gap: 4px; min-width: 0; }
  .day.out { background: transparent; border: 1px dashed var(--line); }
  .day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day .n { font: 500 12px var(--mono); color: var(--muted); }
  .ev { font-size: 11.5px; line-height: 1.25; padding: 3px 6px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.k-late { background: var(--late-soft); color: var(--late); }
  .ev.k-soon { background: var(--soon-soft); color: var(--soon); }
  .ev.k-ok { background: var(--ok-soft); color: var(--ok); }
  .more { font-size: 11px; color: var(--muted); }
  @media (max-width: 640px) {
    .day { min-height: 54px; padding: 4px; }
    .ev { font-size: 0; padding: 0; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .ev.k-late { background: var(--late); } .ev.k-soon { background: var(--soon); } .ev.k-ok { background: var(--ok); }
    .day .evs { display: flex; flex-wrap: wrap; gap: 3px; }
    .more { display: none; }
  }
  .agenda { display: grid; gap: 6px; }
  .agenda .row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); color: inherit; text-decoration: none; }
  .agenda .date { font: 500 12.5px var(--mono); color: var(--muted); }
  .agenda .what { min-width: 0; overflow-wrap: anywhere; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.k-late { background: var(--late-soft); color: var(--late); }
  .badge.k-soon { background: var(--soon-soft); color: var(--soon); }
  .badge.k-ok { background: var(--ok-soft); color: var(--ok); }
  @media (max-width: 520px) { .agenda .row { grid-template-columns: minmax(0, 1fr) auto; } .agenda .date { grid-column: 1 / -1; } }

  .empty { color: var(--muted); padding: 8px 0; }
  .notice { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 20px; display: grid; gap: 10px; max-width: 520px; }
  .notice h2 { font: 600 19px var(--display); margin: 0; }
  .notice input { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .notice .err { color: var(--late); font-size: 14px; }
  .primary { border: 0; background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; justify-self: start; }
  .skeleton { height: 120px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { .view { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
  /* Onboarding */
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 80px; }
  .bar > i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
  .hires { display: grid; gap: 10px; }
  .hire { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; text-align: left; width: 100%; cursor: pointer; }
  .hire:hover, .hire[aria-current="true"] { border-color: var(--accent); }
  .hire .l { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .hire .prog { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
  .hire .prog b { color: var(--fg); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .hire { grid-template-columns: minmax(0, 1fr) auto; } .hire .prog { grid-column: 1 / -1; } }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
  .pill.late { background: var(--late-soft); color: var(--late); border-color: transparent; }
  .pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .phase { display: grid; gap: 6px; }
  .phase h3 { font-size: 13px; font-weight: 600; margin: 6px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
  .task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
  .task input:disabled { cursor: not-allowed; }
  .task .tn { overflow-wrap: anywhere; }
  .task.is-done .tn { color: var(--muted); text-decoration: line-through; }
  .task .tm { font: 12px/1.4 var(--mono); color: var(--muted); margin-top: 2px; }
  .task .tm a { color: var(--accent); }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .tag.hr { background: var(--late-soft); color: var(--late); } .tag.nh { background: var(--retake-soft); color: var(--retake); }
  .tag.late { background: var(--late); color: #fff; } .tag.soon { background: var(--soon-soft); color: var(--soon); }
</style>

<div class="wrap">
  <header class="head">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
    </div>
    <div>
      <h1>Training Compliance Dashboard</h1>
      <p>Every staff member's training, sign-offs and onboarding, read live from Notion.</p>
      <div class="fresh" id="fresh"><span class="dot warn" id="dot"></span><span id="freshText">Loading from Notion…</span></div>
      <div class="who" id="who" hidden></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-overview" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" id="tab-employees" data-tab="employees" aria-selected="false">By Employee</button>
    <button class="tab" role="tab" id="tab-trainings" data-tab="trainings" aria-selected="false">By Training</button>
    <button class="tab" role="tab" id="tab-calendar" data-tab="calendar" aria-selected="false">Calendar</button>
    <button class="tab" role="tab" id="tab-onboarding" data-tab="onboarding" aria-selected="false" hidden>Onboarding</button>
  </nav>

  <main id="view" class="view" aria-live="polite">
    <div class="stats"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </main>
</div>

<script>
// A snapshot is embedded only in the preview build. The deployed app leaves it null and reads /api/dashboard.
const SNAPSHOT = /*SNAPSHOT*/null/*END*/;
const REFRESH_MS = 60000;
const DUE_SOON_DAYS = 60;

const STATUS = {
  missing: { label: "Not completed",     order: 0 },
  retake:  { label: "Retake required",   order: 1 },
  update:  { label: "New version",       order: 2 },
  late:    { label: "Overdue",           order: 3 },
  signoff: { label: "Awaiting sign-off", order: 4 },
  soon:    { label: "Due soon",          order: 5 },
  ok:      { label: "Compliant",         order: 6 },
  na:      { label: "Not applicable",    order: 7 },
};

const state = { data: null, model: null, tab: "overview", emp: null, trn: null, calMonth: null, calFilter: "all", password: null, key: "", confirming: null, signing: null,
  onb: null, onbSel: null, onbFor: "all", onbOpen: true, onbBusy: {}, onbStarting: null, onbErr: null, onbKeep: new Set() };
const $ = (id) => document.getElementById(id);

// ---------- helpers ----------
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function safeUrl(u) { return typeof u === "string" && /^https:\/\//.test(u) ? u : null; }
function parseDate(s) { if (!s) return null; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
function today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function addMonths(date, n) {
  const y = date.getFullYear(), m = date.getMonth() + n, d = date.getDate();
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(d, last));
}
function dayDiff(a, b) { return Math.round((a - b) / 86400000); }
function fmt(d) { return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : ""; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function initials(name) { return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }
const AV = ["#2c6a52", "#3a6ea5", "#9a5b2e", "#7a4f9a", "#a5465e", "#4f7a3a", "#56606a", "#2f7f86"];
function avColor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV[h % AV.length]; }
function avatar(name, lg) { return `<span class="av${lg ? " lg" : ""}" style="background:${avColor(name)}" aria-hidden="true">${esc(initials(name))}</span>`; }
function plural(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }
function freqText(t) { return t.frequency > 0 ? `Every ${plural(t.frequency, "month")}` : "One-time training"; }

// ---------- model: the compliance logic ----------
function compute(data) {
  const now = today();
  const staff = [...data.staff].sort((a, b) => a.name.localeCompare(b.name));
  const trainings = [...data.trainings].sort((a, b) =>
    (a.roles.includes("All Staff") ? 0 : 1) - (b.roles.includes("All Staff") ? 0 : 1) || a.name.localeCompare(b.name));
  const sById = new Map(staff.map(x => [x.id, x])), tById = new Map(trainings.map(x => [x.id, x]));

  const cells = {};
  for (const x of staff) { cells[x.id] = {}; for (const t of trainings) cells[x.id][t.id] = { status: "na" }; }
  const items = [];
  for (const it of data.items) {
    const st = sById.get(it.staffId), t = tById.get(it.trainingId);
    if (!st || !t) continue;
    const c = {
      status: it.status, staff: st, training: t,
      rec: it.recordUrl ? { url: it.recordUrl } : null,
      done: parseDate(it.done), due: parseDate(it.due), days: it.days,
      score: it.score, attempts: it.attempts, extra: it.extra, version: it.version,
      recordId: it.recordId, signedBy: it.signedBy,
      passMark: t.passMark ?? 80,
    };
    cells[st.id][t.id] = c;
    items.push(c);
  }

  const perStaff = staff.map(s => {
    const mine = items.filter(i => i.staff === s);
    const count = k => mine.filter(i => i.status === k).length;
    return { s, mine, total: mine.length, ok: count("ok"), soon: count("soon"), late: count("late"), missing: count("missing"),
             retake: count("retake"), update: count("update"), signoff: count("signoff") };
  });
  return { staff, trainings, cells, items, perStaff, now };
}

// ---------- detail text ----------
function scoreText(c) { return c.score != null ? ` · scored ${c.score}%` : ""; }
function detail(c) {
  if (c.status === "missing") return "Not yet completed";
  if (c.status === "update") return `Completed ${c.version ? c.version : "an older version"} on ${fmt(c.done)} · current is ${c.training.version}`;
  if (c.status === "signoff") return `Completed ${fmt(c.done)}${scoreText(c)} · waiting for manager sign-off`;
  if (c.status === "retake") return `Scored ${c.score ?? "–"}% on ${fmt(c.done)} · pass mark ${c.passMark}% · ${plural(c.attempts, "attempt")}`;
  if (c.status === "late") return `Overdue ${-c.days}d · due ${fmt(c.due)}`;
  if (c.status === "soon") return c.days === 0 ? `Due today · ${fmt(c.due)}` : `Due in ${c.days}d · ${fmt(c.due)}`;
  if (c.signedBy) return `Completed ${fmt(c.done)}${scoreText(c)} · signed off by ${c.signedBy}${c.due ? ` · next due ${fmt(c.due)}` : ""}`;
  if (c.due) return `Completed ${fmt(c.done)}${scoreText(c)} · next due ${fmt(c.due)}`;
  return `Completed ${fmt(c.done)}${scoreText(c)} (one-time)`;
}

// ---------- views ----------
function viewOverview(m) {
  const n = m.staff.length;
  const full = m.perStaff.filter(p => p.total > 0 && p.ok === p.total).length;
  const nonCompliant = m.perStaff.filter(p => p.late + p.missing + p.retake + p.update > 0).length;
  const actionOnly = m.perStaff.filter(p => p.late + p.missing + p.retake + p.update === 0 && p.soon + p.signoff > 0).length;
  const soon = m.items.filter(i => i.status === "soon").length;
  const late = m.items.filter(i => i.status === "late").length;
  const valid = m.items.filter(i => i.status === "ok" || i.status === "soon").length;
  const pct = m.items.length ? Math.round(valid / m.items.length * 100) : 0;
  const pending = m.items.filter(i => i.status === "signoff");
  const retakes = m.items.filter(i => i.status === "retake");

  const head = m.trainings.map(t => `<th class="col" scope="col" title="${esc(t.name)}"><span>${esc(t.name)}</span></th>`).join("");
  const rows = m.staff.map(s => `<tr>
      <td class="who"><button class="rowbtn" data-emp="${esc(s.id)}">${avatar(s.name)}<span><span class="nm">${esc(s.name)}</span><br><span class="role">${esc(s.role || "No role")}</span></span></button></td>
      ${m.trainings.map(t => { const c = m.cells[s.id][t.id];
        const tip = c.status === "na" ? `${t.name}: not applicable` : `${t.name}: ${STATUS[c.status].label} — ${detail(c)}`;
        return `<td><span class="cell st-${c.status}" title="${esc(tip)}" role="img" aria-label="${esc(tip)}"></span></td>`; }).join("")}
    </tr>`).join("");

  return `
  <section class="stats" aria-label="Summary">
    <div class="stat"><span class="k">Staff tracked</span><span class="v">${n}</span><span class="s">${plural(m.trainings.length, "training")} tracked</span></div>
    <div class="stat"><span class="k">Fully compliant</span><span class="v ok">${full}</span><span class="s">${nonCompliant} non-compliant · ${actionOnly} action needed</span></div>
    <div class="stat"><span class="k">Needs action soon</span><span class="v soon">${soon}</span><span class="s">Due within ${DUE_SOON_DAYS} days${late ? ` · ${late} overdue` : ", nothing overdue"}</span></div>
    <div class="stat"><span class="k">Overall completion rate</span><span class="v miss">${pct}%</span><span class="s">${valid} of ${m.items.length} tracked items</span></div>
  </section>

  <section class="panel">
    <h2>Training compliance heatmap</h2>
    <p class="sub">Every staff member × every applicable training. Click a name to open that person.</p>
    <div class="legend">
      <span><i class="sw st-ok"></i>Compliant</span><span><i class="sw st-soon"></i>Due soon</span>
      <span><i class="sw st-late"></i>Overdue</span><span><i class="sw st-missing"></i>Not completed</span><span><i class="sw st-retake"></i>Retake required</span><span><i class="sw st-update"></i>New version</span><span><i class="sw st-signoff"></i>Awaiting sign-off</span>
      <span><i class="sw" style="border:1px dashed var(--na)"></i>Not applicable</span>
    </div>
    <div class="scroll-x"><table class="heat"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </section>

  ${retakes.length ? `<section class="panel">
    <h2>Needs a retake</h2>
    <p class="sub">Latest quiz attempt scored below the training's pass mark.</p>
    <div class="people">${retakes.map(i => {
      const u = safeUrl(i.rec.url); const tag = u ? "a" : "div";
      return `<${tag} class="person"${u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ""}><span class="l">${avatar(i.staff.name)}<span><span class="nm">${esc(i.staff.name)}</span><br><span class="role">${esc(i.training.name)}</span></span></span><span class="d">${esc(detail(i))}</span></${tag}>`;
    }).join("")}</div>
  </section>` : ""}

  ${pending.length ? `<section class="panel" id="signoff">
    <h2>Waiting for manager sign-off</h2>
    <p class="sub">${state.data.canSignOff ? "The employee has completed it. Sign off once you've seen them do it." : "Open the dashboard with your Manager Link to sign these off."}</p>
    <div class="people">${pending.map(signRow).join("")}</div>
  </section>` : ""}`;
}

function signRow(i) {
  const u = i.rec ? safeUrl(i.rec.url) : null;
  const me = state.data.me;
  const own = me && i.staff.id === me.id;
  let acts = "";
  if (state.data.canSignOff && i.recordId) {
    if (own) acts = `<span class="link">Another manager signs off your own training</span>`;
    else if (state.signing === i.recordId) acts = `<button class="btn small" type="button" disabled>Signing off…</button>`;
    else if (state.confirming === i.recordId) acts = `<span class="link">Sign off as ${esc(me.name)}?</span><button class="btn small ok" type="button" data-sign="${esc(i.recordId)}">Confirm</button><button class="btn small" type="button" data-cancel>Cancel</button>`;
    else acts = `<button class="btn small primary" type="button" data-ask="${esc(i.recordId)}">Sign off</button>`;
  }
  return `<div class="signrow">
    <span class="l" style="display:flex;gap:10px;align-items:center;min-width:0">${avatar(i.staff.name)}<span><span class="nm">${esc(i.staff.name)}</span><br><span class="role">${esc(i.training.name)} · completed ${fmt(i.done)}${i.score != null ? ` · scored ${i.score}%` : ""}</span></span></span>
    <span class="acts">${u ? `<a class="link" href="${esc(u)}" target="_blank" rel="noopener">View record</a>` : ""}${acts}</span>
  </div>`;
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

async function signOff(recordId) {
  state.signing = recordId; state.confirming = null; render();
  try {
    const r = await fetch("/api/dashboard", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: state.key, recordId }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "The sign-off couldn't be saved.");
    toast(`Signed off by ${res.signedBy}`);
  } catch (e) {
    toast(e.message);
  }
  state.signing = null;
  await load();
}

function itemCard(c, titleText) {
  const u = c.rec ? safeUrl(c.rec.url) : null;
  const tag = u ? "a" : "div";
  return `<${tag} class="item k-${c.status}"${u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ""}>
    <span class="t">${esc(titleText)}</span><span class="d">${esc(detail(c))}</span>
    ${c.extra ? `<span class="chip extra">Assigned individually</span>` : ""}
  </${tag}>`;
}

function groups(list, renderOne) {
  const order = ["missing", "retake", "update", "late", "signoff", "soon", "ok"];
  return order.map(k => {
    const g = list.filter(c => c.status === k);
    if (!g.length) return "";
    return `<div class="group"><h3><i class="sw st-${k}"></i>${STATUS[k].label} (${g.length})</h3>${renderOne(g)}</div>`;
  }).join("");
}

function viewEmployees(m) {
  if (!m.staff.length) return `<p class="empty">No active staff in the Team database yet.</p>`;
  if (!state.emp || !m.cells[state.emp]) state.emp = m.staff[0].id;
  const p = m.perStaff.find(x => x.s.id === state.emp);
  const s = p.s;
  const pct = p.total ? Math.round((p.ok + p.soon) / p.total * 100) : 0;
  const opts = m.staff.map(x => `<option value="${esc(x.id)}"${x.id === s.id ? " selected" : ""}>${esc(x.name)}</option>`).join("");
  const sorted = [...p.mine].sort((a, b) => a.training.name.localeCompare(b.training.name));
  return `
  <div class="pick"><label for="empSelect">Staff member</label><select id="empSelect">${opts}</select></div>
  <section class="panel">
    <div class="profile">${avatar(s.name, true)}<div><h2>${esc(s.name)}</h2><div class="role">${esc(s.role || "No role")}${s.hireDate ? ` · hired ${fmt(parseDate(s.hireDate))}` : ""}</div></div></div>
    <div class="facts"><span><b>${p.total}</b> trainings tracked</span><span><b>${p.ok}</b> on track</span><span><b>${p.total - p.ok}</b> need attention</span><span><b>${pct}%</b> completion rate</span></div>
    ${p.total ? groups(sorted, g => `<div class="items">${g.map(c => itemCard(c, c.training.name)).join("")}</div>`) : `<p class="empty">No trainings apply to this role.</p>`}

}

function viewTrainings(m) {
  if (!m.trainings.length) return `<p class="empty">No trainings in the Trainings database yet.</p>`;
  if (!state.trn || !m.trainings.some(t => t.id === state.trn)) state.trn = m.trainings[0].id;

    ${list.length ? groups(list, g => `<div class="people">${g.map(c => {

    }).join("")}</div>`) : `<p class="empty">This training doesn't apply to any current staff.</p>`}
  </section>`;
}

function viewCalendar(m) {
  const now = m.now;
  if (!state.calMonth) state.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const month = state.calMonth;
  const dated = m.items.filter(i => i.due);
  const within = d => dated.filter(i => i.days >= 0 && i.days <= d).length;
  const late = dated.filter(i => i.days < 0);

  const f = state.calFilter;
  const inFilter = i =>
    f === "late" ? i.days < 0 :
    f === "30" ? i.days >= 0 && i.days <= 30 :
    f === "60" ? i.days >= 0 && i.days <= 60 :
    f === "90" ? i.days >= 0 && i.days <= 90 : true;
  const shown = dated.filter(inFilter);

  const byDay = new Map();
  for (const i of shown) { const k = iso(i.due); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(i); }

  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  let cellsHtml = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let k = 0; k < 42; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    if (k >= 35 && d.getMonth() !== month.getMonth()) break;
    const evs = byDay.get(iso(d)) || [];
    const out = d.getMonth() !== month.getMonth();
    const isToday = iso(d) === iso(now);
    cellsHtml += `<div class="day${out ? " out" : ""}${isToday ? " today" : ""}"><span class="n">${d.getDate()}</span><div class="evs">${
      evs.slice(0, 3).map(i => `<span class="ev k-${i.status}" title="${esc(`${i.staff.name} — ${i.training.name}: ${detail(i)}`)}">${esc(i.staff.name.split(" ")[0])} · ${esc(i.training.name)}</span>`).join("")
    }${evs.length > 3 ? `<span class="more">+${evs.length - 3} more</span>` : ""}</div></div>`;
  }

  const inMonth = i => i.due.getMonth() === month.getMonth() && i.due.getFullYear() === month.getFullYear();
  const agendaList = (f === "all" ? shown.filter(inMonth) : shown).sort((a, b) => a.due - b.due);
  const monthName = month.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const fb = (k, label) => `<button data-filter="${k}" aria-pressed="${f === k}">${label}</button>`;

  return `
  <section class="stats" aria-label="Upcoming">
    <div class="stat"><span class="k">Overdue</span><span class="v late">${late.length}</span><span class="s">Past their due date</span></div>
    <div class="stat"><span class="k">Due in 7 days</span><span class="v soon">${within(7)}</span><span class="s">By ${fmt(new Date(now.getTime() + 7 * 864e5))}</span></div>
    <div class="stat"><span class="k">Due in 30 days</span><span class="v soon">${within(30)}</span><span class="s">By ${fmt(new Date(now.getTime() + 30 * 864e5))}</span></div>
    <div class="stat"><span class="k">Due in 90 days</span><span class="v miss">${within(90)}</span><span class="s">By ${fmt(new Date(now.getTime() + 90 * 864e5))}</span></div>
  </section>
  <section class="panel">
    <div class="calbar">
      <div class="calnav">
        <button class="btn" data-cal="prev" aria-label="Previous month">‹</button>
        <h2>${esc(monthName)}</h2>
        <button class="btn" data-cal="next" aria-label="Next month">›</button>
        <button class="btn" data-cal="today">Today</button>
      </div>
      <div class="filters" role="group" aria-label="Filter">${fb("all","All")}${fb("late","Overdue")}${fb("30","Next 30d")}${fb("60","Next 60d")}${fb("90","Next 90d")}</div>
    </div>
    <div class="cal">${cellsHtml}</div>
  </section>
  <section class="panel">
    <h2>${f === "all" ? `Due in ${esc(monthName)}` : f === "late" ? "Overdue" : `Due in the next ${f} days`}</h2>
    ${agendaList.length ? `<div class="agenda">${agendaList.map(i => {
      const u = i.rec ? safeUrl(i.rec.url) : null; const tag = u ? "a" : "div";
      return `<${tag} class="row"${u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ""}><span class="date">${fmt(i.due)}</span><span class="what"><b>${esc(i.staff.name)}</b> · ${esc(i.training.name)}</span><span class="badge k-${i.status}">${i.status === "late" ? `${-i.days}d late` : i.status === "soon" ? `in ${i.days}d` : "On track"}</span></${tag}>`;
    }).join("")}</div>` : `<p class="empty">Nothing due ${f === "all" ? "this month" : "in this range"}.</p>`}
  </section>`;
}


// ---------- onboarding ----------
const TASK_LABEL = { late: "Overdue", soon: "Due soon", open: "", done: "" };
function viewOnboarding() {
  const d = state.onb;
  if (state.onbErr) return `<div class="notice"><h2>Onboarding couldn't load.</h2><p>${esc(state.onbErr)}</p><button class="primary" type="button" data-onb-reload>Try again</button></div>`;
  if (!d) return `<div class="stats"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;
  const people = d.people;
  const active = people.filter(p => !p.started || p.all.done < p.all.total);
  const lateTasks = people.reduce((n, p) => n + p.all.late, 0);
  const forMe = people.filter(p => p.canManage).reduce((n, p) => n + p.tasks.filter(t => t.for === "HR & Compliance" && !t.doneOn).length, 0);
  const finished = people.filter(p => p.started && p.all.done === p.all.total).length;
  if (!state.onbSel || !people.some(p => p.id === state.onbSel)) state.onbSel = (active[0] || people[0] || {}).id || null;
  const sel = people.find(p => p.id === state.onbSel);

  const list = people.length ? `<div class="hires">${people.map(p => {
    const pct = p.all.total ? Math.round(p.all.done / p.all.total * 100) : 0;
    const right = !p.started ? `<span class="pill">Not started</span>`
      : p.all.done === p.all.total ? `<span class="pill done">Complete</span>`
      : p.all.late ? `<span class="pill late">${p.all.late} overdue</span>` : `<span class="pill">${pct}%</span>`;
    return `<button class="hire" type="button" data-onb="${esc(p.id)}" aria-current="${p.id === state.onbSel}">
      <span class="l">${avatar(p.name)}<span><span class="nm">${esc(p.name)}</span><br><span class="role">${esc(p.role || "No role")}${p.hireDate ? ` · starts ${fmt(parseDate(p.hireDate))}` : " · no hire date"}${p.manager ? ` · with ${esc(p.manager)}` : ""}</span></span></span>
      <span class="prog">${p.started ? `<span class="bar"><i style="width:${pct}%"></i></span><span>New hire <b>${p.newHire.done}/${p.newHire.total}</b> · HR &amp; Compliance <b>${p.hr.done}/${p.hr.total}</b></span>` : `<span>No tasks yet</span>`}</span>
      ${right}
    </button>`;
  }).join("")}</div>` : `<p class="empty">Nobody is being onboarded. Set someone's Employment Status to “Onboarding” in the Team database and they'll appear here.</p>`;

  return `
  <section class="stats" aria-label="Onboarding summary">
    <div class="stat"><span class="k">Being onboarded</span><span class="v">${active.length}</span><span class="s">${finished} finished</span></div>
    <div class="stat"><span class="k">Overdue tasks</span><span class="v ${lateTasks ? "late" : "ok"}">${lateTasks}</span><span class="s">Past their due date</span></div>
    <div class="stat"><span class="k">HR tasks for you</span><span class="v soon">${forMe}</span><span class="s">${d.me.isAdmin ? "You're an admin" : "For people you onboard"}</span></div>
    <div class="stat"><span class="k">Not started</span><span class="v miss">${people.filter(p => !p.started).length}</span><span class="s">Need their tasks created</span></div>
  </section>
  <section class="panel">
    <h2>New hires</h2>
    <p class="sub">Tasks come from the Onboarding Task Library in Notion. Click someone to see their checklist.</p>
    ${list}
  </section>
  ${sel ? onboardingDetail(sel) : ""}`;
}

function onboardingDetail(p) {
  const head = `<div class="profile">${avatar(p.name, true)}<div><h2>${esc(p.name)}</h2><div class="role">${esc(p.role || "No role")}${p.hireDate ? ` · starts ${fmt(parseDate(p.hireDate))}` : ""} · onboarding manager: ${p.manager ? esc(p.manager) : "not set"}</div></div></div>`;
  if (!p.started) {
    let action;
    if (state.onbStarting && state.onbStarting.id === p.id) action = `<button class="btn" type="button" disabled>Creating tasks… ${state.onbStarting.made} so far</button>`;
    else if (!p.canManage) action = `<p class="empty">Their onboarding manager${p.manager ? ` (${esc(p.manager)})` : ""} or an admin starts this.</p>`;
    else if (!p.hireDate) action = `<p class="empty">Add a Hire Date on ${esc(p.name)}'s row in Notion first. Due dates are worked out from it.</p>`;
    else action = `<button class="primary" type="button" data-onb-start="${esc(p.id)}">Start onboarding</button><p class="sub" style="margin:0">Creates ${esc(p.name.split(" ")[0])}'s New hire and HR &amp; Compliance tasks for the ${esc(p.role || "All Staff")} role, with due dates from their start date.</p>`;
    return `<section class="panel">${head}${action}</section>`;
  }
  const f = state.onbFor;
  let tasks = p.tasks.filter(t => f === "all" || (f === "hr" ? t.for === "HR & Compliance" : t.for !== "HR & Compliance"));
  const keep = t => !t.doneOn || state.onbKeep.has(t.id);
  const hiddenDone = state.onbOpen ? tasks.filter(t => !keep(t)).length : 0;
  if (state.onbOpen) tasks = tasks.filter(keep);
  const phases = [...new Set(tasks.map(t => t.phase || "Other"))];
  const fb = (k, label) => `<button data-onb-for="${k}" aria-pressed="${f === k}">${label}</button>`;
  return `<section class="panel">
    ${head}
    <div class="facts"><span><b>${p.all.done}/${p.all.total}</b> done</span><span><b>${p.all.late}</b> overdue</span><span>New hire <b>${p.newHire.done}/${p.newHire.total}</b></span><span>HR &amp; Compliance <b>${p.hr.done}/${p.hr.total}</b></span></div>
    <div class="calbar">
      <div class="filters" role="group" aria-label="Whose tasks">${fb("all", "All")}${fb("hr", "HR &amp; Compliance")}${fb("nh", "New hire")}</div>
      <div class="filters" role="group" aria-label="Show"><button data-onb-open="1" aria-pressed="${state.onbOpen}">Still to do</button><button data-onb-open="0" aria-pressed="${!state.onbOpen}">Everything</button></div>
    </div>
    ${!p.canManage ? `<p class="sub" style="margin:0">View only. ${p.manager ? esc(p.manager) : "Their onboarding manager"} or an admin ticks these off.</p>` : ""}
    ${tasks.length ? phases.map(ph => `<div class="phase"><h3>${esc(ph)}</h3>${tasks.filter(t => (t.phase || "Other") === ph).map(t => taskRow(t, p)).join("")}</div>`).join("")
      : `<p class="empty">${hiddenDone ? "Everything here is done. 🎉" : "No tasks in this list."}</p>`}
    ${hiddenDone && tasks.length ? `<p class="link">${hiddenDone} done ${hiddenDone === 1 ? "task" : "tasks"} hidden · <button class="btn small" type="button" data-onb-open="0">Show everything</button></p>` : ""}
  </section>`;
}

function taskRow(t, p) {
  const busy = state.onbBusy[t.id];
  const meta = [t.owner ? `Owner: ${esc(t.owner)}` : "", t.doneOn ? `Done ${fmt(parseDate(t.doneOn))}${t.doneBy ? ` by ${esc(t.doneBy)}` : ""}` : t.due ? `Due ${fmt(parseDate(t.due))}` : "No due date",
    t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">Open link</a>` : ""].filter(Boolean).join(" · ");
  const st = t.doneOn ? "" : t.state === "late" ? `<span class="tag late">Overdue</span>` : t.state === "soon" ? `<span class="tag soon">Due soon</span>` : "";
  return `<div class="task${t.doneOn ? " is-done" : ""}">
    <input type="checkbox" data-onb-task="${esc(t.id)}" data-person="${esc(p.id)}" ${t.doneOn ? "checked" : ""} ${!p.canManage || busy ? "disabled" : ""} aria-label="${esc(t.name)}">
    <div><div class="tn">${esc(t.name)}</div><div class="tm">${meta}${t.notes ? ` · ${esc(t.notes)}` : ""}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${st}<span class="tag ${t.for === "HR & Compliance" ? "hr" : "nh"}">${t.for === "HR & Compliance" ? "HR" : "New hire"}</span></div>
  </div>`;
}

async function loadOnboarding() {
  try {
    const r = await fetch("/api/onboarding?view=team&key=" + encodeURIComponent(state.key), { cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.message || "Couldn't load onboarding from Notion.");
    state.onb = body; state.onbErr = null;
  } catch (e) { if (!state.onb) state.onbErr = e.message; else toast(e.message); }
  if (state.tab === "onboarding") render();
}

async function onbPost(payload) {
  const r = await fetch("/api/onboarding", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: state.key, ...payload }) });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(res.message || "That couldn't be saved.");
  return res;
}

async function startOnboarding(personId) {
  state.onbStarting = { id: personId, made: 0 }; render();
  try {
    for (let i = 0; i < 20; i++) {
      const res = await onbPost({ action: "start", personId });
      state.onbStarting.made += res.created; render();
      if (!res.remaining) break;
    }
    toast(`Onboarding started · ${state.onbStarting.made} tasks created`);
  } catch (e) { toast(e.message); }
  state.onbStarting = null;
  await loadOnboarding();
}

async function toggleTask(box) {
  const id = box.dataset.onbTask, done = box.checked;
  const p = state.onb.people.find(x => x.id === box.dataset.person);
  const t = p && p.tasks.find(x => x.id === id);
  if (!t) return;
  state.onbBusy[id] = true;
  state.onbKeep.add(id);
  const before = { doneOn: t.doneOn, doneBy: t.doneBy };
  t.doneOn = done ? iso(today()) : null; t.doneBy = done ? (state.onb.me.name) : null;
  render();
  try { await onbPost({ action: done ? "done" : "undo", taskId: id }); }
  catch (e) { Object.assign(t, before); toast(e.message); }
  delete state.onbBusy[id];
  await loadOnboarding();
}

// ---------- render ----------
function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  if (!state.model) return;
  const v = $("view");
  const html = state.tab === "employees" ? viewEmployees(state.model)
    : state.tab === "trainings" ? viewTrainings(state.model)
    : state.tab === "calendar" ? viewCalendar(state.model)
    : state.tab === "onboarding" ? viewOnboarding()
    : viewOverview(state.model);
  v.innerHTML = html;
}

function setTab(tab) {
  state.tab = tab;
  if (tab === "onboarding" && !state.onb) loadOnboarding();
  try { history.replaceState(null, "", "#" + tab); } catch {}
  render();
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) return setTab(tab.dataset.tab);
  const emp = e.target.closest("[data-emp]");
  if (emp) { state.emp = emp.dataset.emp; return setTab("employees"); }
  const cal = e.target.closest("[data-cal]");
  if (cal) {
    const m = state.calMonth;
    if (cal.dataset.cal === "prev") state.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    if (cal.dataset.cal === "next") state.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    if (cal.dataset.cal === "today") { const n = today(); state.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
    return render();
  }
  const fl = e.target.closest("[data-filter]");
  if (fl) { state.calFilter = fl.dataset.filter; return render(); }
  const ask = e.target.closest("[data-ask]");
  if (ask) { state.confirming = ask.dataset.ask; return render(); }
  if (e.target.closest("[data-cancel]")) { state.confirming = null; return render(); }
  const sign = e.target.closest("[data-sign]");
  if (sign) return signOff(sign.dataset.sign);
  const onb = e.target.closest("[data-onb]");
  if (onb) { state.onbSel = onb.dataset.onb; state.onbKeep.clear(); return render(); }
  const of = e.target.closest("[data-onb-for]");
  if (of) { state.onbFor = of.dataset.onbFor; state.onbKeep.clear(); return render(); }
  const oo = e.target.closest("[data-onb-open]");
  if (oo) { state.onbOpen = oo.dataset.onbOpen === "1"; state.onbKeep.clear(); return render(); }
  const os = e.target.closest("[data-onb-start]");
  if (os) return startOnboarding(os.dataset.onbStart);
  if (e.target.closest("[data-onb-reload]")) { state.onbErr = null; render(); return loadOnboarding(); }
});
document.addEventListener("change", (e) => {
  if (e.target.matches("[data-onb-task]")) return toggleTask(e.target);
  if (e.target.id === "empSelect") { state.emp = e.target.value; render(); }
  if (e.target.id === "trnSelect") { state.trn = e.target.value; render(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "pwForm") {
    e.preventDefault();
    state.password = $("pw").value;
    try { sessionStorage.setItem("dash-pw", state.password); } catch {}
    load();
  }
});

// ---------- data loading ----------
function setFresh(kind, text) {
  $("dot").className = "dot" + (kind === "ok" ? "" : kind === "warn" ? " warn" : " err");
  $("freshText").innerHTML = text;
}

function showLogin(body, wrong) {
  $("who").hidden = true;
  $("view").innerHTML = `<div class="notice">
    <h2>Managers only</h2>
    <p>${esc(body.message || "Open your Manager Link from Notion.")}</p>
    <p class="sub">Your Manager Link is on your row in the Team database in Notion.</p>
  </div>${body.passwordAllowed && !state.key ? passwordForm(wrong) : ""}`;
  setFresh("warn", "Sign-in needed");
}

function passwordForm(wrong) {
  return `<form class="notice" id="pwForm">
    <h2>Or view with the dashboard password</h2>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    ${wrong ? `<span class="err">That password didn't work. Check it and try again.</span>` : ""}
    <button class="primary" type="submit">Open dashboard (view only)</button>
  </form>`;
}

function accept(data) {
  state.data = data;
  state.model = compute(data);
  $("tab-onboarding").hidden = !data.onboarding;
  if (!data.onboarding && state.tab === "onboarding") state.tab = "overview";
  if (state.tab === "onboarding" && !Object.keys(state.onbBusy).length && !state.onbStarting) loadOnboarding();
  render();
}

async function load() {
  if (SNAPSHOT) {
    accept(SNAPSHOT);
    const at = new Date(SNAPSHOT.generatedAt);
    setFresh("warn", `Preview · snapshot of Notion taken ${esc(fmt(at))}, ${esc(at.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }))}. The deployed app reads Notion live.`);
    return;
  }
  try {
    const headers = state.password && !state.key ? { "x-dashboard-password": state.password } : {};
    const r = await fetch("/api/dashboard" + (state.key ? "?key=" + encodeURIComponent(state.key) : ""), { headers, cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { state.model = null; return showLogin(body, !!state.password); }
    if (!r.ok) throw new Error(body.message || "Couldn't load data from Notion.");
    accept(body);
    const who = $("who"); who.hidden = false;
    who.innerHTML = body.me
      ? `Signed in as <b>${esc(body.me.name)}</b> · <a href="/me.html?key=${encodeURIComponent(state.key)}">My own trainings</a>`
      : "View only · open your Manager Link to sign off trainings";
    setFresh("ok", `Live from Notion · updated ${esc(new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }))} · refreshes every minute`);
  } catch (err) {
    if (state.model) setFresh("err", `Couldn't refresh · showing data from earlier. ${esc(err.message)}`);
    else {
      setFresh("err", "Couldn't load data");
      $("view").innerHTML = `<div class="notice"><h2>The dashboard couldn't reach Notion.</h2><p>${esc(err.message)}</p><button class="primary" type="button" id="retry">Try again</button></div>`;
      $("retry").addEventListener("click", load);
    }
  }
}

(function start() {
  const h = (location.hash || "").slice(1);
  if (["overview", "employees", "trainings", "calendar", "onboarding"].includes(h)) state.tab = h;
  try { state.password = sessionStorage.getItem("dash-pw"); } catch {}
  state.key = new URLSearchParams(location.search).get("key") || "";
  render();
  load();
  if (!SNAPSHOT) setInterval(() => { if (document.visibilityState === "visible") load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!SNAPSHOT && document.visibilityState === "visible") load(); });
})();
</script>

</html>
