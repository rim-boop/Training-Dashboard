<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Trainings</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1f1f1f; --muted:#6b6b6b; --line:#e6e6e3;
          --green:#2f7d5b; --amber:#b7791f; --red:#b83b3b; --gray:#8a8a85; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:26px; }
  .stat span { color:var(--muted); font-size:13px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
         background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:14px 16px; margin-bottom:8px; text-decoration:none; color:inherit; }
  .row:hover { border-color:#ccc; }
  .due { color:var(--muted); font-size:13px; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; white-space:nowrap; color:#fff; }
  .Completed { background:var(--green); } .Overdue { background:var(--red); }
  .Not\ started { background:var(--gray); }
  .msg { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<main>
  <h1>My trainings</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="stats">
    <div class="stat"><b id="s-done">–</b><span>Completed</span></div>
    <div class="stat"><b id="s-todo">–</b><span>Not started</span></div>
    <div class="stat"><b id="s-late">–</b><span>Overdue</span></div>
  </div>
  <div id="list"></div>
</main>
<script>
  const key = new URLSearchParams(location.search).get("key");
  const list = document.getElementById("list");

  async function load() {
    if (!key) { list.innerHTML = '<p class="msg">Open your personal link to see your trainings.</p>'; return; }
    try {
      const res = await fetch("/api/trainings?key=" + encodeURIComponent(key));
      if (!res.ok) throw new Error(res.status === 403 ? "This link isn't valid." : "Couldn't load trainings.");
      const rows = await res.json();
      const count = s => rows.filter(r => r.status === s).length;
      document.getElementById("s-done").textContent = count("Completed");
      document.getElementById("s-todo").textContent = count("Not started");
      document.getElementById("s-late").textContent = count("Overdue");
      list.innerHTML = rows.length ? rows.map(r => `
        <a class="row" href="${r.url}" target="_blank" rel="noopener">
          <div><div>${escapeHtml(r.training)}</div>
               <div class="due">${r.due ? "Due " + new Date(r.due).toLocaleDateString() : "No due date"}</div></div>
          <span class="pill ${r.status}">${escapeHtml(r.status)}</span>
        </a>`).join("") : '<p class="msg">No trainings assigned to you.</p>';
      document.getElementById("updated").textContent = "Live from Notion · updated " + new Date().toLocaleTimeString();
    } catch (e) {
      list.innerHTML = `<p class="msg">${e.message}</p>`;
    }
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  load();
  setInterval(load, 60000); // re-read Notion every minute
</script>
</body>
</html>
