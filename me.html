<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one column for phone or desk — my trainings by urgency; opening one shows its Notion lesson, then the quiz or confirmation */
  :root {
    --bg: #f4f5f2; --surface: #ffffff; --surface-2: #eef0ec; --fg: #1b231f; --muted: #5d6963; --line: #dde2dd;
    --accent: #2c6a52; --accent-ink: #ffffff;
    --ok: #3d8a63; --ok-soft: #e1f0e7; --soon: #b07a23; --soon-soft: #f7ecd6;
    --late: #b5443d; --late-soft: #f8e3e1; --miss: #74559f; --miss-soft: #ece5f5;
    --retake: #2f6fae; --retake-soft: #e2ecf8; --update: #b0447a; --update-soft: #f8e2ee;
    --n-blue: #2f6fae; --n-blue-bg: #e7f0f9; --n-yellow-bg: #fbf3db; --n-red-bg: #fbe8e6; --n-green-bg: #e6f2ea; --n-purple-bg: #f0eaf8; --n-pink-bg: #f9e8f1; --n-orange-bg: #fbeee0; --n-brown-bg: #f2ebe4;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111614; --surface: #19201d; --surface-2: #222a26; --fg: #e5ebe7; --muted: #9aa7a0; --line: #2c3631;
      --accent: #6cbf98; --accent-ink: #0f1a15;
      --ok: #6cc595; --ok-soft: #1c3227; --soon: #e0b062; --soon-soft: #362b17;
      --late: #ec8a82; --late-soft: #3a1f1d; --miss: #b49ae0; --miss-soft: #2b2338;
      --retake: #8ab8ec; --retake-soft: #1b2a3d; --update: #ee9cc6; --update-soft: #3a1f2e;
      --n-blue: #8ab8ec; --n-blue-bg: #1b2a3d; --n-yellow-bg: #362f17; --n-red-bg: #3a1f1d; --n-green-bg: #1c3227; --n-purple-bg: #2b2338; --n-pink-bg: #3a1f2e; --n-orange-bg: #3a2a19; --n-brown-bg: #2f2822;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(24px, env(safe-area-inset-top, 0px)) 56px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }

  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font: 600 clamp(26px, 6vw, 34px)/1.1 var(--display); margin: 2px 0 0; text-wrap: balance; }
  .role { color: var(--muted); font-size: 14px; }
  .fresh { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: baseline; margin-top: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; transform: translateY(-1px); }
  .dot.warn { background: var(--soon); } .dot.err { background: var(--late); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
  .stat b { font: 600 30px/1 var(--display); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.todo b { color: var(--soon); } .stat.wait b { color: var(--retake); } .stat.ok b { color: var(--ok); }
  @media (max-width: 420px) { .stat b { font-size: 24px; } .stat { padding: 12px; } }

  .list { display: grid; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .card.k-retake { border-color: var(--retake); } .card.k-late { border-color: var(--late); } .card.k-update { border-color: var(--update); }
  .row1 { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .name { font: 600 17px/1.3 var(--display); overflow-wrap: anywhere; }
  .meta { font: 13px/1.5 var(--mono); color: var(--muted); }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .k-ok.pill { color: var(--ok); background: var(--ok-soft); } .k-soon.pill { color: var(--soon); background: var(--soon-soft); }
  .k-late.pill { color: var(--late); background: var(--late-soft); } .k-missing.pill { color: var(--miss); background: var(--miss-soft); }
  .k-retake.pill { color: var(--retake); background: var(--retake-soft); } .k-update.pill { color: var(--update); background: var(--update-soft); }
  .k-signoff.pill { color: var(--ok); background: transparent; box-shadow: inset 0 0 0 1.5px var(--ok); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--fg); font-size: 15px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .note { color: var(--muted); font-size: 14px; }

  /* lesson */
  .lesson-head { display: grid; gap: 8px; }
  .lesson-head h2 { font: 600 clamp(24px, 5vw, 30px)/1.15 var(--display); margin: 0; text-wrap: balance; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .progress { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
  .progress .top { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .doc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 10px; min-width: 0; }
  .doc > *, .doc .callout > *, .doc .col > * { margin: 0; min-width: 0; }
  .doc h2, .doc h3, .doc h4 { font-family: var(--display); font-weight: 600; line-height: 1.25; text-wrap: balance; }
  .doc h2 { font-size: 22px; } .doc h3 { font-size: 18px; } .doc h4 { font-size: 16px; }
  .doc p { overflow-wrap: anywhere; }
  .doc ul, .doc ol { padding-left: 1.3em; display: grid; gap: 4px; }
  .doc hr { border: 0; border-top: 1px solid var(--line); width: 100%; }
  .doc code { font: 14px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .doc img { max-width: 100%; border-radius: 8px; }
  .doc blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  .callout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); }
  .callout.noicon { grid-template-columns: minmax(0, 1fr); }
  .callout .ic { font-size: 18px; line-height: 1.5; }
  .callout .body { display: grid; gap: 8px; min-width: 0; }
  .callout .body > * { margin: 0; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .col { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--surface); cursor: pointer; }
  .callout .todo { background: var(--bg); }
  .todo input { margin-top: 5px; accent-color: var(--accent); flex: none; width: 17px; height: 17px; }
  .todo:has(input:checked) span { color: var(--muted); }
  details summary { cursor: pointer; font-weight: 600; }
  .linkout { display: inline-flex; gap: 6px; align-items: center; }
  .bg-gray_bg, .bg-default { background: var(--surface-2); } .bg-blue_bg { background: var(--n-blue-bg); } .bg-yellow_bg { background: var(--n-yellow-bg); }
  .bg-red_bg { background: var(--n-red-bg); } .bg-green_bg { background: var(--n-green-bg); } .bg-purple_bg { background: var(--n-purple-bg); }
  .bg-pink_bg { background: var(--n-pink-bg); } .bg-orange_bg { background: var(--n-orange-bg); } .bg-brown_bg { background: var(--n-brown-bg); }
  .c-green { color: var(--ok); } .c-blue { color: var(--n-blue); } .c-red { color: var(--late); } .c-orange, .c-yellow { color: var(--soon); }
  .c-purple { color: var(--miss); } .c-pink { color: var(--update); } .c-gray, .c-brown { color: var(--muted); }

  .finish { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
  .finish h3 { font: 600 19px/1.25 var(--display); margin: 0; }
  .confirm-box { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 8px; background: var(--surface-2); cursor: pointer; font-weight: 500; }
  .confirm-box input { margin-top: 5px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }

  /* quiz */
  .quiz { display: grid; gap: 16px; }
  .quiz h2 { font: 600 24px/1.2 var(--display); margin: 0; text-wrap: balance; }
  fieldset { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; margin: 0; display: grid; gap: 8px; min-width: 0; }
  fieldset.missing { border-color: var(--late); }
  legend { float: left; width: 100%; padding: 0; margin: 0 0 6px; font-weight: 600; }
  legend + * { clear: both; }
  .qnum { font: 500 12px var(--mono); color: var(--muted); display: block; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); cursor: pointer; }
  label.opt:has(input:checked) { outline: 2px solid var(--accent); outline-offset: -2px; }
  label.opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
  .letter { font: 500 13px var(--mono); color: var(--muted); }
  .err { color: var(--late); font-size: 14px; }

  .result { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 12px; }
  .result .big { font: 600 56px/1 var(--display); font-variant-numeric: tabular-nums; }
  .result.pass .big { color: var(--ok); } .result.fail .big { color: var(--retake); }
  .result h2 { font: 600 22px/1.2 var(--display); margin: 0; }
  .marks { display: flex; flex-wrap: wrap; gap: 6px; }
  .mark { font: 500 13px var(--mono); padding: 4px 10px; border-radius: 6px; }
  .mark.r { background: var(--ok-soft); color: var(--ok); } .mark.w { background: var(--retake-soft); color: var(--retake); }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px; color: var(--muted); }
  .skeleton { height: 96px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  /* onboarding */
  .switch { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; justify-self: start; }
  .switch button { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); font-size: 15px; }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .switch .n { font: 500 12px var(--mono); margin-left: 4px; opacity: .8; }
  .ob-top { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .ob-top .big { font: 600 22px/1.2 var(--display); }
  .ob-top .bar i { background: var(--ok); }
  .ob-phase { display: grid; gap: 8px; margin-top: 14px; }
  .ob-phase h3 { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
  .ob-task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
  .ob-task.late { border-color: var(--late); }
  .ob-task input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ok); flex: none; cursor: pointer; }
  .ob-task .tn { font-weight: 500; overflow-wrap: anywhere; }
  .ob-task.done .tn { color: var(--muted); text-decoration: line-through; }
  .ob-task .tm { font: 12.5px/1.5 var(--mono); color: var(--muted); }
  .ob-task .tm .late { color: var(--late); font-weight: 500; }
  .ob-task { cursor: default; align-items: center; }
  .ob-open { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: grid; gap: 2px; font: inherit; color: inherit; }
  .ob-open:hover .tn { color: var(--accent); }
  .ob-task .chev { color: var(--muted); font-size: 22px; line-height: 1; flex: none; }
  .ob-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .ob-trn { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">My trainings</div>
    <h1 id="hello">Loading your trainings…</h1>
    <div class="role" id="role"></div>
    <div class="fresh"><span class="dot warn" id="dot"></span><span id="freshText">Connecting…</span></div>
  </header>

  <nav class="switch" id="switch" hidden aria-label="Sections">
    <button type="button" data-view="onboarding" aria-pressed="false">My onboarding<span class="n" id="swOb"></span></button>
    <button type="button" data-view="trainings" aria-pressed="true">My trainings<span class="n" id="swTr"></span></button>
  </nav>

  <section id="onboard" hidden></section>

  <section id="home">
    <div class="stats" aria-label="Summary">
      <div class="stat todo"><b id="nTodo">–</b><span>To do</span></div>
      <div class="stat wait"><b id="nWait">–</b><span>Waiting for sign-off</span></div>
      <div class="stat ok"><b id="nDone">–</b><span>Done</span></div>
    </div>
    <div class="list" id="list" style="margin-top:16px"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section id="detail" hidden aria-live="polite"></section>
</div>

<script>
const key = new URLSearchParams(location.search).get("key") || "";
const $ = (id) => document.getElementById(id);
const LABEL = { missing: "To do", retake: "Retake required", update: "New version", late: "Overdue", signoff: "Waiting for sign-off", soon: "Due soon", ok: "Done" };
const RANK = { retake: 0, update: 1, late: 2, missing: 3, soon: 4, signoff: 5, ok: 6 };
const ACTIONABLE = new Set(["missing", "retake", "update", "late", "soon"]);
let data = null, away = false, ob = null, view = null, obBusy = {};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmt(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
function setFresh(kind, text) { $("dot").className = "dot" + (kind === "ok" ? "" : kind === "warn" ? " warn" : " err"); $("freshText").textContent = text; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } }

function line(t) {
  if (t.status === "retake") return `Last score ${t.lastScore ?? "–"}% · you need ${t.passMark}% to pass`;
  if (t.status === "update") return `Updated to ${t.version} · please read and confirm again`;
  if (t.status === "signoff") return `Completed ${fmt(t.done)} · your manager will sign it off`;
  if (t.status === "missing") return t.completion === "Quiz" ? `Read it, then pass the quiz (${t.passMark}%)` : "Read it, then confirm";
  if (t.status === "late") return `Overdue since ${fmt(t.due)}`;
  if (t.status === "soon") return `Due ${fmt(t.due)} (in ${t.days} day${t.days === 1 ? "" : "s"})`;
  const score = t.lastScore != null ? ` · scored ${t.lastScore}%` : "";
  return t.due ? `Done ${fmt(t.done)}${score} · next due ${fmt(t.due)}` : `Done ${fmt(t.done)}${score}`;
}

// ---------- home ----------
function renderHome() {
  if (!data) return;
  $("hello").textContent = `Hi ${data.person.name.split(" ")[0]}`;
  $("role").innerHTML = esc(data.person.role || "") + (data.person.isManager ? `${data.person.role ? " · " : ""}<a href="/?key=${encodeURIComponent(key)}">Open the manager portal</a>` : "");
  const list = [...data.trainings].sort((a, b) => RANK[a.status] - RANK[b.status] || (a.due || "9").localeCompare(b.due || "9") || a.name.localeCompare(b.name));
  $("nTodo").textContent = list.filter(t => ACTIONABLE.has(t.status)).length;
  $("nWait").textContent = list.filter(t => t.status === "signoff").length;
  $("nDone").textContent = list.filter(t => t.status === "ok").length;
  $("list").innerHTML = list.length ? list.map(t => `
    <article class="card k-${t.status}">
      <div class="row1"><div><div class="name">${esc(t.name)}</div><div class="meta">${esc(line(t))}</div></div><span class="pill k-${t.status}">${LABEL[t.status]}</span></div>
      <div class="actions"><button class="btn${ACTIONABLE.has(t.status) ? " primary" : ""}" type="button" data-open="${esc(t.id)}">${ACTIONABLE.has(t.status) ? (t.status === "retake" ? "Review and retake" : "Start the training") : "Open the training"}</button></div>
    </article>`).join("") : `<div class="empty">No trainings are assigned to you yet.</div>`;
}

async function loadHome() {
  if (!key) { $("hello").textContent = "Open your personal link"; $("list").innerHTML = `<div class="empty">This page needs your personal link. Ask your manager to send it to you.</div>`; setFresh("err", "No personal link"); return; }
  try {
    const r = await fetch("/api/me?key=" + encodeURIComponent(key), { cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.message || "Couldn't load your trainings.");
    data = body;
    if (!away) renderHome();
    applyView();
    setFresh("ok", "Up to date · " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) {
    if (data) setFresh("err", "Couldn't refresh · " + e.message);
    else { $("hello").textContent = "We couldn't open your trainings"; $("list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; setFresh("err", "Not loaded"); }
  }
}

function showDetail(html) { away = true; $("home").hidden = true; $("onboard").hidden = true; $("switch").hidden = true; const d = $("detail"); d.hidden = false; d.innerHTML = html; window.scrollTo(0, 0); }
function goHome() { away = false; $("detail").hidden = true; $("detail").innerHTML = ""; renderHome(); applyView(); loadHome(); loadOnboarding(); }
const backBtn = `<div><button class="btn" type="button" data-back>← Back</button></div>`;


// ---------- onboarding ----------
function obLine(t) {
  if (t.doneOn) return `Done ${fmt(t.doneOn)}${t.doneBy ? ` by ${esc(t.doneBy)}` : ""}`;
  if (!t.due) return "No due date";
  return t.state === "late" ? `<span class="late">Overdue · was due ${fmt(t.due)}</span>` : `Due ${fmt(t.due)}`;
}
function renderOnboarding() {
  const el = $("onboard");
  if (!ob) { el.innerHTML = ""; return; }
  if (!ob.tasks.length) { el.innerHTML = `<div class="ob-top"><div class="big">Your onboarding checklist isn't ready yet</div><div class="note">${ob.hireDate ? `Your start date: ${fmt(ob.hireDate)}. ` : ""}Your onboarding manager sets it up before you start. Your tasks will appear here.</div></div>`; return; }
  const { mine, hr } = ob;
  const pct = mine.total ? Math.round(mine.done / mine.total * 100) : 0;
  const phases = [...new Set(ob.tasks.map(t => t.phase || "Other"))];
  el.innerHTML = `
    <div class="ob-top">
      <div class="big">${mine.done === mine.total ? "You've finished your onboarding checklist 🎉" : `${mine.done} of ${mine.total} done`}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="note">${ob.hireDate ? `Your start date: ${fmt(ob.hireDate)}. ` : ""}${mine.late ? `<b style="color:var(--late)">${mine.late} overdue.</b> ` : ""}Tap a task for its details, tick it when it's done.${hr.total ? ` HR has finished ${hr.done} of ${hr.total} things on their side.` : ""}</div>
    </div>
    ${phases.map(ph => `<div class="ob-phase"><h3>${esc(ph)}</h3>${ob.tasks.filter(t => (t.phase || "Other") === ph).map(t => `
      <div class="ob-task${t.doneOn ? " done" : ""}${!t.doneOn && t.state === "late" ? " late" : ""}">
        <input type="checkbox" data-ob="${esc(t.id)}" ${t.doneOn ? "checked" : ""} ${obBusy[t.id] ? "disabled" : ""} aria-label="Done: ${esc(t.name)}">
        <button class="ob-open" type="button" data-obtask="${esc(t.id)}"><span class="tn">${esc(t.name)}</span><span class="tm">${obLine(t)}</span></button>
        <span class="chev" aria-hidden="true">›</span>
      </div>`).join("")}</div>`).join("")}`;
}
function applyView() {
  const hasOb = !!(ob && (ob.tasks.length || ob.status === "Onboarding"));
  $("switch").hidden = !hasOb || away;
  if (hasOb && !view) view = (!ob.mine.total || ob.mine.done < ob.mine.total) ? "onboarding" : "trainings";
  const cur = hasOb ? view : "trainings";
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === cur)));
  if (hasOb) {
    $("swOb").textContent = ob.mine.total ? `${ob.mine.done}/${ob.mine.total}` : "";
    $("swTr").textContent = data ? String(data.trainings.filter(t => ACTIONABLE.has(t.status)).length || "") : "";
  }
  if (away) { $("onboard").hidden = true; $("home").hidden = true; return; }
  $("onboard").hidden = cur !== "onboarding";
  $("home").hidden = cur !== "trainings";
  $("eyebrow").textContent = cur === "onboarding" ? "My onboarding" : "My trainings";
  if (cur === "onboarding") renderOnboarding();
}
async function loadOnboarding() {
  if (!key) return;
  try {
    const r = await fetch("/api/onboarding?key=" + encodeURIComponent(key), { cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (r.ok && body.enabled) ob = body;
  } catch {}
  applyView();
}
async function tickOb(box) {
  const t = ob.tasks.find(x => x.id === box.dataset.ob); if (!t) return;
  const done = box.checked, before = { doneOn: t.doneOn, doneBy: t.doneBy, state: t.state };
  obBusy[t.id] = true;
  t.doneOn = done ? new Date().toISOString().slice(0, 10) : null; t.doneBy = null;
  ob.mine.done += done ? 1 : -1;
  renderOnboarding(); applyView();
  try {
    const r = await fetch("/api/onboarding", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, taskId: t.id, action: done ? "done" : "undo" }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "That couldn't be saved.");
  } catch (e) {
    Object.assign(t, before); ob.mine.done += done ? -1 : 1;
    setFresh("err", e.message + " Please try again.");
  }
  delete obBusy[t.id];
  await loadOnboarding();
}

async function openObTask(id) {
  showDetail(`${backBtn}<div class="skeleton"></div>`);
  try {
    const r = await fetch(`/api/onboarding?key=${encodeURIComponent(key)}&task=${encodeURIComponent(id)}`, { cache: "no-store" });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "Couldn't open this task.");
    const t = res.task;
    todoCount = 0;
    const body = blocks(res.blocks || []);
    const chips = [t.phase, t.due ? `Due ${fmt(t.due)}` : "No due date", t.category].filter(Boolean);
    showDetail(`${backBtn}
      <div class="lesson-head">
        <div class="eyebrow">Onboarding task</div>
        <h2>${esc(t.name)}</h2>
        <div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}${t.doneOn ? `<span class="pill k-ok">Done</span>` : t.state === "late" ? `<span class="pill k-late">Overdue</span>` : ""}</div>
      </div>
      <article class="doc">${body || `<p class="note">There's no description for this task yet. Ask your manager if anything is unclear.</p>`}
        ${t.notes ? `<p class="note">${esc(t.notes)}</p>` : ""}
        ${t.link ? `<p><a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">Open the link ↗</a></p>` : ""}
      </article>
      <div class="finish">
        ${t.doneOn ? `<h3>Done</h3><div class="note">Ticked off on ${fmt(t.doneOn)}${t.doneBy ? ` by ${esc(t.doneBy)}` : ""}.</div>
          <div class="actions"><button class="btn" type="button" data-obmark="${esc(t.id)}" data-done="0">Mark as not done</button></div>`
        : `<h3>Finished this one?</h3><div class="err" id="obErr" role="alert"></div>
          <div class="actions"><button class="btn primary" type="button" data-obmark="${esc(t.id)}" data-done="1">Mark as done</button></div>`}
      </div>`);
    wireTodos("ob-" + t.id);
  } catch (e) {
    showDetail(`${backBtn}<div class="empty">${esc(e.message)}</div>`);
  }
}
async function markObFromDetail(btn) {
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const r = await fetch("/api/onboarding", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, taskId: btn.dataset.obmark, action: btn.dataset.done === "1" ? "done" : "undo" }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "That couldn't be saved.");
    view = "onboarding"; goHome();
  } catch (e) {
    const el = $("obErr"); if (el) el.textContent = e.message + " Please try again.";
    btn.disabled = false; btn.textContent = btn.dataset.done === "1" ? "Mark as done" : "Mark as not done";
  }
}

// ---------- lesson rendering (Notion blocks) ----------
function rt(arr) {
  return (arr || []).map(t => {
    let h = esc(t.text).replace(/\n/g, "<br>");
    if (t.code) h = `<code>${h}</code>`;
    if (t.b) h = `<strong>${h}</strong>`;
    if (t.i) h = `<em>${h}</em>`;
    if (t.s) h = `<s>${h}</s>`;
    if (t.u) h = `<u>${h}</u>`;
    if (t.color && !t.color.endsWith("_background")) h = `<span class="c-${esc(t.color)}">${h}</span>`;
    if (t.href) h = `<a href="${esc(t.href)}" target="_blank" rel="noopener">${h}</a>`;
    return h;
  }).join("");
}
let todoCount = 0;
function blocks(list) {
  let out = "", i = 0;
  while (i < list.length) {
    const b = list[i];
    if (b.type === "bulleted_list_item" || b.type === "numbered_list_item") {
      const tag = b.type === "bulleted_list_item" ? "ul" : "ol";
      out += `<${tag}>`;
      while (i < list.length && list[i].type === b.type) { out += `<li>${rt(list[i].text)}${list[i].children ? blocks(list[i].children) : ""}</li>`; i++; }
      out += `</${tag}>`;
      continue;
    }
    out += block(b); i++;
  }
  return out;
}
function block(b) {
  const kids = b.children ? blocks(b.children) : "";
  switch (b.type) {
    case "paragraph": return b.text && b.text.length ? `<p>${rt(b.text)}</p>${kids}` : "";
    case "heading_1": return `<h2>${rt(b.text)}</h2>`;
    case "heading_2": return `<h3>${rt(b.text)}</h3>`;
    case "heading_3": return `<h4>${rt(b.text)}</h4>`;
    case "divider": return "<hr>";
    case "quote": return `<blockquote>${rt(b.text)}${kids}</blockquote>`;
    case "to_do": { const n = todoCount++; return `<label class="todo"><input type="checkbox" data-todo="${n}"><span>${rt(b.text)}</span></label>${kids}`; }
    case "toggle": return `<details><summary>${rt(b.text)}</summary>${kids}</details>`;
    case "callout": {
      const bg = /_background$/.test(b.color || "") ? b.color.replace("_background", "_bg") : (b.color || "default");
      const icon = b.icon ? `<span class="ic" aria-hidden="true">${esc(b.icon)}</span>` : "";
      return `<div class="callout bg-${esc(bg)}${icon ? "" : " noicon"}">${icon}<div class="body">${b.text && b.text.length ? `<p>${rt(b.text)}</p>` : ""}${kids}</div></div>`;
    }
    case "column_list": return `<div class="cols">${(b.children || []).map(c => `<div class="col">${c.children ? blocks(c.children) : ""}</div>`).join("")}</div>`;
    case "image": return b.src && /^https:\/\//.test(b.src) ? `<figure style="margin:0"><img src="${esc(b.src)}" alt="${esc((b.caption || []).map(c => c.text).join(""))}">${b.caption && b.caption.length ? `<figcaption class="note">${rt(b.caption)}</figcaption>` : ""}</figure>` : "";
    case "bookmark": case "embed": case "video": case "pdf": case "file": case "link_preview":
      return b.href && /^https:\/\//.test(b.href) ? `<p><a class="linkout" href="${esc(b.href)}" target="_blank" rel="noopener">${b.caption && b.caption.length ? rt(b.caption) : (b.type === "video" ? "Watch the video" : b.type === "pdf" || b.type === "file" ? "Open the document" : esc(b.href))} ↗</a></p>` : "";
    default: return kids;
  }
}

async function openLesson(id) {
  showDetail(`${backBtn}<div class="skeleton"></div>`);
  try {
    const r = await fetch(`/api/me?key=${encodeURIComponent(key)}&lesson=${encodeURIComponent(id)}`, { cache: "no-store" });
    const L = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(L.message || "Couldn't open this training.");
    const t = L.training;
    todoCount = 0;
    const body = blocks(L.blocks || []);
    const chips = [
      t.completion === "Quiz" ? `Quiz · pass ${t.passMark}%` : "Read & confirm",
      t.needsSignoff ? "Manager sign-off" : null,
      t.frequency > 0 ? (t.frequency % 12 === 0 ? `Every ${t.frequency / 12 === 1 ? "year" : t.frequency / 12 + " years"}` : `Every ${t.frequency} months`) : "One-time",
      t.version ? t.version : null,
    ].filter(Boolean);
    showDetail(`${backBtn}
      <div class="lesson-head">
        <div class="eyebrow">${esc(t.category || "Training")}</div>
        <h2>${esc(t.name)}</h2>
        <div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}<span class="pill k-${t.status}">${LABEL[t.status]}</span></div>
      </div>
      ${todoCount ? `<div class="progress"><div class="top"><span>Your progress through this page</span><span id="pct">0%</span></div><div class="bar"><i id="barFill"></i></div><div class="note">Ticks are saved on this device only. They help you keep your place.</div></div>` : ""}
      <article class="doc">${body || `<p class="note">There's no written lesson for this training yet.</p>`}
        ${t.material ? `<p><a class="btn" href="${esc(t.material)}" target="_blank" rel="noopener">Open the document ↗</a></p>` : ""}
      </article>
      ${finishHtml(t)}`);
    wireTodos(t.id);
    const cb = $("readCheck"); if (cb) cb.addEventListener("change", () => { $("confirmBtn").disabled = !cb.checked; });
  } catch (e) {
    showDetail(`${backBtn}<div class="empty">${esc(e.message)}</div>`);
  }
}

function finishHtml(t) {
  if (t.status === "ok") return `<div class="finish"><h3>You've completed this training</h3><div class="note">${esc(line(t))}</div></div>`;
  if (t.status === "signoff") return `<div class="finish"><h3>Waiting for your manager's sign-off</h3><div class="note">You completed this on ${fmt(t.done)}. Your manager signs it off once they've seen you do it.</div></div>`;
  if (t.completion === "Quiz") {
    if (!t.questionCount) return `<div class="finish"><h3>The quiz isn't ready yet</h3><div class="note">Your manager is adding the questions. Come back to this training later.</div></div>`;
    return `<div class="finish"><h3>${t.status === "retake" ? "Ready to try the quiz again?" : "Take the quiz"}</h3>
      <div class="note">${t.questionCount} question${t.questionCount === 1 ? "" : "s"} · you need ${t.passMark}% to pass · unlimited attempts${t.needsSignoff ? " · then your manager signs it off" : ""}</div>
      <div class="actions"><button class="btn primary" type="button" data-quiz="${esc(t.id)}">${t.status === "retake" ? "Retake the quiz" : "Start the quiz"}</button></div></div>`;
  }
  return `<div class="finish"><h3>${t.status === "update" ? "Confirm the new version" : "Confirm you've read it"}</h3>
    <label class="confirm-box" for="readCheck"><input type="checkbox" id="readCheck"><span>I have read and understood this training${t.version ? ` (${esc(t.version)})` : ""}.</span></label>
    ${t.needsSignoff ? `<div class="note">After you confirm, your manager signs it off once they've seen you do it.</div>` : ""}
    <div class="err" id="confirmErr" role="alert"></div>
    <div class="actions"><button class="btn primary" type="button" id="confirmBtn" data-confirm="${esc(t.id)}" disabled>Confirm</button></div></div>`;
}

function wireTodos(trainingId) {
  const boxes = [...document.querySelectorAll("[data-todo]")];
  if (!boxes.length) return;
  const k = `todo:${key}:${trainingId}`;
  const saved = store(k) || {};
  boxes.forEach(b => { b.checked = !!saved[b.dataset.todo]; });
  const update = () => {
    const done = boxes.filter(b => b.checked).length, pct = Math.round(done / boxes.length * 100);
    if ($("pct")) { $("pct").textContent = pct + "%"; $("barFill").style.width = pct + "%"; }
  };
  boxes.forEach(b => b.addEventListener("change", () => { const s = store(k) || {}; s[b.dataset.todo] = b.checked; store(k, s); update(); }));
  update();
}

async function confirmRead(id) {
  const btn = $("confirmBtn"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const r = await fetch("/api/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, trainingId: id, action: "confirm" }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "Your confirmation couldn't be saved.");
    showDetail(`<div class="result pass"><div class="eyebrow">Confirmed</div>
      <h2>${res.needsSignoff ? "Thanks. Your manager will sign this off next." : "Thanks. This training is done."}</h2>
      <div class="note">${res.needsSignoff ? "It shows as Waiting for sign-off until your manager has seen you do it." : "Your confirmation has been saved."}</div>
      <div class="actions"><button class="btn primary" type="button" data-back>Back to my trainings</button></div></div>`);
    loadHome();
  } catch (e) {
    $("confirmErr").textContent = e.message + " Please try again.";
    btn.disabled = false; btn.textContent = "Confirm";
  }
}

// ---------- quiz ----------
async function openQuiz(trainingId) {
  showDetail(`<div class="skeleton"></div>`);
  try {
    const r = await fetch(`/api/me?key=${encodeURIComponent(key)}&quiz=${encodeURIComponent(trainingId)}`, { cache: "no-store" });
    const q = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(q.message || "Couldn't load the quiz.");
    if (!q.questions.length) throw new Error("This training has no quiz questions yet.");
    showDetail(`
      <div><button class="btn" type="button" data-open="${esc(q.training.id)}">← Back to the training</button></div>
      <div class="quiz"><div><div class="eyebrow">Quiz</div><h2>${esc(q.training.name)}</h2>
        <div class="note">${q.questions.length} question${q.questions.length === 1 ? "" : "s"} · you need ${q.training.passMark}% to pass</div></div>
      <form id="quizForm" class="quiz" novalidate>
        ${q.questions.map((qq, i) => `<fieldset id="fs-${esc(qq.id)}">
          <legend><span class="qnum">Question ${i + 1} of ${q.questions.length}</span>${esc(qq.text)}</legend>
          ${qq.options.map(o => `<label class="opt"><input type="radio" name="${esc(qq.id)}" value="${esc(o.letter)}" id="o-${esc(qq.id)}-${esc(o.letter)}"><span><span class="letter">${esc(o.letter)}</span> ${esc(o.text)}</span></label>`).join("")}
        </fieldset>`).join("")}
        <div class="err" id="quizErr" role="alert"></div>
        <div class="actions"><button class="btn primary" type="submit" id="submitBtn">Submit answers</button></div>
      </form></div>`);
    $("quizForm").addEventListener("submit", (e) => { e.preventDefault(); submitQuiz(q); });
    $("quizForm").addEventListener("change", (e) => { const fs = e.target.closest("fieldset"); if (fs) fs.classList.remove("missing"); $("quizErr").textContent = ""; });
  } catch (e) {
    showDetail(`${backBtn}<div class="empty">${esc(e.message)}</div>`);
  }
}

async function submitQuiz(q) {
  const answers = {}; let firstMissing = null;
  for (const qq of q.questions) {
    const picked = document.querySelector(`input[name="${CSS.escape(qq.id)}"]:checked`);
    const fs = document.getElementById("fs-" + qq.id);
    if (picked) { answers[qq.id] = picked.value; fs.classList.remove("missing"); }
    else { fs.classList.add("missing"); firstMissing = firstMissing || fs; }
  }
  if (firstMissing) {
    $("quizErr").textContent = `Answer every question before submitting. ${q.questions.length - Object.keys(answers).length} left.`;
    firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Marking…";
  try {
    const r = await fetch("/api/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, trainingId: q.training.id, action: "quiz", answers }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.message || "Your answers couldn't be saved.");
    showDetail(`
      <div class="result ${res.passed ? "pass" : "fail"}">
        <div class="eyebrow">${esc(q.training.name)}</div>
        <div class="big">${res.score}%</div>
        <h2>${res.passed ? (res.needsSignoff ? "Passed. Your manager will sign this off next." : "Passed. This training is done.") : "Not passed yet. Please retake this training."}</h2>
        <div class="note">${res.correct} of ${res.total} correct · pass mark ${res.passMark}%. ${res.passed ? "Your result has been saved." : "Your attempt has been saved. Review the training and take the quiz again."}</div>
        <div class="marks">${res.review.map(m => `<span class="mark ${m.right ? "r" : "w"}">Q${m.number} ${m.right ? "✓" : "✗"}</span>`).join("")}</div>
        <div class="actions">
          ${!res.passed ? `<button class="btn" type="button" data-open="${esc(q.training.id)}">Review the training</button><button class="btn primary" type="button" data-quiz="${esc(q.training.id)}">Try again</button>` : ""}
          <button class="btn${res.passed ? " primary" : ""}" type="button" data-back>Back to my trainings</button>
        </div>
      </div>`);
    loadHome();
  } catch (e) {
    $("quizErr").textContent = e.message + " Your answers are still here, so you can try again.";
    btn.disabled = false; btn.textContent = "Submit answers";
  }
}

document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]"); if (o) return openLesson(o.dataset.open);
  const q = e.target.closest("[data-quiz]"); if (q) return openQuiz(q.dataset.quiz);
  const c = e.target.closest("[data-confirm]"); if (c) return confirmRead(c.dataset.confirm);
  if (e.target.closest("[data-back]")) return goHome();
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; return applyView(); }
  const ot = e.target.closest("[data-obtask]"); if (ot) return openObTask(ot.dataset.obtask);
  const om = e.target.closest("[data-obmark]"); if (om) return markObFromDetail(om);
});
document.addEventListener("change", (e) => { if (e.target.matches("[data-ob]")) tickOb(e.target); });

loadHome();
loadOnboarding();
setInterval(() => { if (!away && document.visibilityState === "visible") { loadHome(); loadOnboarding(); } }, 120000);
</script>
